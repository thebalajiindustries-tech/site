name: CI

# Build + test Ganak on every push and PR, automatically, before Render
# ever sees the code. Needs zero secrets: the backend test suite is fully
# hermetic (SQLite temp DBs, the LLM call monkeypatched out -- see
# backend/tests/test_isolation.py), and the frontend build only needs a
# placeholder API URL since NEXT_PUBLIC_* is baked in at build time.

on:
  push:
    branches: [ganak, main]
  pull_request:
    branches: [ganak, main]
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend (compile + test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile check
        working-directory: backend
        run: python -m py_compile app/*.py

      - name: Run test suite
        working-directory: backend
        # Each test_*.py is a standalone script (uses sys.exit), not a
        # pytest module -- run them the same way we do locally.
        run: |
          set -e
          for f in tests/test_*.py; do
            echo "=== $f ==="
            python "$f"
          done

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        # Same output: "standalone" build Render's Dockerfile runs -- catches
        # TypeScript/build errors here instead of failing mid-deploy.
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.vidmahitech.com
