<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2346c4">
<meta name="description" content="महाराष्ट्र SSC इयत्ता १० वी: मराठी ऑडिओ धडे, आकृत्या, सराव प्रश्न आणि उत्तरपत्रिका तपासणी">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SSC Saathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a school notebook page. Ruled ground, red margin rule, ink-blue headings, examiner's red for marks. One column app shell with a sticky top bar and a tab rail. */
:root{
  --paper:#f6f8fc; --sheet:#ffffff; --rule:#dfe6f3; --ink:#1b2a4e; --ink-2:#4a5878; --ink-3:#7a86a3;
  --blue:#2346c4; --blue-soft:#e6ecff; --red:#d23a3a; --red-soft:#fde8e6; --green:#1f8a55; --green-soft:#e2f5ea;
  --amber:#b7740b; --amber-soft:#fff2d6; --line:#d6ddeb;
  --m:#2346c4; --s:#0f8a7a; --h:#9a4a12; --g:#3c7a1c; --e:#8a3fb0;
  --stage:#10204a; --stage-ink:#f4f6ff; --chalk:#ffd86b;
  --display:"Baloo 2","Mukta",system-ui,sans-serif; --body:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1528; --sheet:#151e36; --rule:#1d2742; --ink:#e7ecfb; --ink-2:#b2bcd8; --ink-3:#8590b0;
  --blue:#8aa5ff; --blue-soft:#1d2b5c; --red:#ff7d73; --red-soft:#3d1c22; --green:#5fd39a; --green-soft:#143528;
  --amber:#f2b94b; --amber-soft:#3a2d12; --line:#28324f;
  --m:#8aa5ff; --s:#4fd1bd; --h:#f0a067; --g:#93d66a; --e:#cf98ef;
  --stage:#070d1f; --stage-ink:#eef1ff; --chalk:#ffd86b; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1528; --sheet:#151e36; --rule:#1d2742; --ink:#e7ecfb; --ink-2:#b2bcd8; --ink-3:#8590b0;
  --blue:#8aa5ff; --blue-soft:#1d2b5c; --red:#ff7d73; --red-soft:#3d1c22; --green:#5fd39a; --green-soft:#143528;
  --amber:#f2b94b; --amber-soft:#3a2d12; --line:#28324f;
  --m:#8aa5ff; --s:#4fd1bd; --h:#f0a067; --g:#93d66a; --e:#cf98ef;
  --stage:#070d1f; --stage-ink:#eef1ff; --chalk:#ffd86b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.mr{font-family:"Mukta",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 96px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;background:none;border:0;padding:0}
.brand b{font-family:var(--display);font-size:24px;font-weight:800;color:var(--blue);letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--ink-3)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;font-weight:600;color:var(--ink-2);font-size:15px}
.tab[aria-current="true"]{background:var(--blue);color:var(--sheet)}
.tab:hover:not([aria-current="true"]){background:var(--blue-soft)}
@media (max-width:640px){
  .top{backdrop-filter:none;background:var(--paper)}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;flex-wrap:nowrap}
  .tab{font-size:13px;padding:6px 8px}
}

/* generic */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);padding:8px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.grid{display:grid;gap:14px}
.bar{height:8px;background:var(--rule);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.note{border-left:3px solid var(--red);padding:8px 12px;background:var(--red-soft);border-radius:0 8px 8px 0}
.hidden{display:none}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:18px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(28px,5vw,40px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--red)}
.count{display:flex;align-items:baseline;gap:8px}
.count b{font-family:var(--display);font-size:56px;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.subjects{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:14px}
.subj{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:16px;display:grid;gap:8px;position:relative;overflow:hidden}
.subj::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--hue)}
.subj:hover{border-color:var(--hue)}
.subj h3{font-size:20px}
.subj .mr{font-size:14px;color:var(--ink-2)}
.section-h{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.section-h h2{font-size:24px}

/* chapter list */
.crumbs{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-3);margin-top:16px;flex-wrap:wrap}
.crumbs button{background:none;border:0;color:var(--blue);padding:0;font-weight:600}
.chlist{display:grid;gap:8px;margin-top:14px}
.ch{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.ch:hover{border-color:var(--hue)}
.ch .no{font-family:var(--display);font-size:22px;font-weight:800;color:var(--hue);text-align:center}
.ch .t{font-weight:700;font-size:17px;line-height:1.25}
.ch .mr{font-size:14px;color:var(--ink-2)}
.ch .st{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* chapter view */
.chhead{margin-top:10px;display:grid;gap:6px}
.chhead h1{font-size:clamp(24px,4.5vw,34px);font-weight:800}
.chhead .mr{font-size:18px;color:var(--ink-2)}
.subtabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.subtab{white-space:nowrap;border:1px solid var(--line);background:var(--sheet);padding:7px 14px;border-radius:999px;font-weight:600;color:var(--ink-2)}
.subtab[aria-selected="true"]{border-color:var(--hue);color:var(--hue);box-shadow:inset 0 -3px 0 var(--hue)}
.panel{margin-top:14px}

/* video player */
.player{border-radius:var(--r);overflow:hidden;background:var(--stage);color:var(--stage-ink);border:1px solid var(--line)}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;padding:clamp(16px,4vw,40px);display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:hidden;
  background-image:radial-gradient(circle at 85% 15%,color-mix(in srgb,var(--hue) 35%,transparent),transparent 45%),repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.04) 39px 40px)}
@media (max-width:560px){.stage{aspect-ratio:auto;min-height:300px}}
.stage .tag{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk)}
.stage h2{font-size:clamp(22px,4.2vw,40px);color:#fff}
.stage p{font-size:clamp(16px,2.4vw,22px);margin:0;max-width:60ch;line-height:1.45}
.stage .mrline{font-size:clamp(14px,2vw,18px);color:#c9d3ff;border-left:3px solid var(--chalk);padding-left:10px}
.stage .fx{font-family:var(--mono);font-size:clamp(14px,2.2vw,20px);background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.25);padding:6px 12px;border-radius:8px;display:inline-block}
.stage .fxs{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.stage .big{font-family:var(--display);font-size:clamp(60px,12vw,120px);line-height:.9;color:var(--chalk);font-weight:800}
.reveal{animation:rise .55s ease both}
.reveal:nth-child(2){animation-delay:.25s}.reveal:nth-child(3){animation-delay:.5s}.reveal:nth-child(4){animation-delay:.75s}.reveal:nth-child(5){animation-delay:1s}.reveal:nth-child(6){animation-delay:1.25s}.reveal:nth-child(7){animation-delay:1.5s}
@keyframes rise{from{opacity:.0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
.controls{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(0,0,0,.25);flex-wrap:wrap}
.controls button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600}
.controls button:hover{background:rgba(255,255,255,.2)}
.controls label{display:flex;gap:6px;align-items:center;font-size:14px}
.segs{display:flex;gap:3px;flex:1;min-width:140px}
.segs button{flex:1;height:6px;padding:0;border:0;border-radius:3px;background:rgba(255,255,255,.2);position:relative;overflow:hidden}
.segs button i{position:absolute;inset:0;width:0;background:var(--chalk)}
.segs button.done i{width:100%}
.time{font-family:var(--mono);font-size:13px;opacity:.85}

/* notes */
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.kp{margin:0;padding-left:20px;display:grid;gap:6px}
.kp li::marker{color:var(--hue);font-weight:700}
.formula{font-family:var(--mono);font-size:15px;background:var(--blue-soft);padding:8px 12px;border-radius:8px;overflow-x:auto;white-space:nowrap}
.flist{display:grid;gap:8px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:4px 12px;font-weight:600;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

/* quiz */
.quiz{max-width:720px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qtext{font-size:20px;font-weight:600;margin:12px 0}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.opt b{font-family:var(--mono);color:var(--ink-3)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.explain{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--amber-soft)}
.score{font-family:var(--display);font-size:64px;font-weight:800;color:var(--red);line-height:1}

/* checker */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:var(--sheet)}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thumb{position:relative;width:96px;height:120px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;font-size:12px;padding:2px 6px}
.field{display:grid;gap:4px}
.field label{font-weight:600;font-size:14px}
.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 10px;width:100%}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.form2{grid-template-columns:1fr}}
.result-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.marks{font-family:var(--display);font-weight:800;font-size:54px;color:var(--red);line-height:1;font-variant-numeric:tabular-nums}
.marks small{font-size:24px;color:var(--ink-3)}
.qres{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;background:var(--sheet)}
.qres .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qres .h b{font-size:16px}
.redpen{font-family:var(--display);color:var(--red);font-weight:700;font-variant-numeric:tabular-nums}

/* chat */
.chat{display:grid;gap:10px;max-width:780px}
.msgs{display:grid;gap:10px;min-height:120px}
.msg{padding:10px 14px;border-radius:12px;max-width:92%;min-width:0;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--blue);color:var(--sheet);border-bottom-right-radius:4px}
.msg.ai{justify-self:start;background:var(--sheet);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai p{margin:0 0 6px}
.msg.ai ul{margin:4px 0 6px;padding-left:20px}
.compose{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.compose textarea{flex:1;min-width:200px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px;resize:vertical;min-height:48px}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--ink-2)}

/* plan */
.plan{display:grid;gap:8px}
.day{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;align-items:start}
.day .d{font-family:var(--mono);font-size:13px;color:var(--ink-3)}
@media (max-width:480px){.day{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:999px;font-weight:600;z-index:50}

/* diagrams */
.dg{width:100%;height:auto;display:block;--dg-ink:var(--ink);--dg-mute:var(--ink-3);--dg-line:var(--ink-2);--dg-a:var(--blue);--dg-b:var(--red);--dg-c:var(--green);--dg-fill:var(--sheet);--dg-fa:var(--blue-soft);--dg-fb:var(--red-soft);--dg-fc:var(--green-soft);--dg-fd:var(--amber-soft)}
.stage .dg{--dg-ink:#f4f6ff;--dg-mute:#aab4d8;--dg-line:#c9d3ff;--dg-a:var(--chalk);--dg-b:#8fb3ff;--dg-c:#7ee2b8;--dg-fill:rgba(255,255,255,.06);--dg-fa:rgba(255,216,107,.16);--dg-fb:rgba(143,179,255,.2);--dg-fc:rgba(126,226,184,.18);--dg-fd:rgba(255,160,103,.2)}
.dg text{font-family:var(--body)}
.dg .tx{fill:var(--dg-ink)} .dg .mu{fill:var(--dg-mute)} .dg .acct{fill:var(--dg-a)} .dg .acct2{fill:var(--dg-b)} .dg .acct3{fill:var(--dg-c)}
.dg .ln{stroke:var(--dg-line);stroke-width:2;fill:none} .dg .ax{stroke:var(--dg-mute);stroke-width:1.5;fill:none}
.dg .acc{stroke:var(--dg-a);stroke-width:3;fill:none} .dg .acc2{stroke:var(--dg-b);stroke-width:3;fill:none} .dg .acc3{stroke:var(--dg-c);stroke-width:3;fill:none}
.dg .ahd{fill:var(--dg-line)}
.dg .bx{fill:var(--dg-fill);stroke:var(--dg-line);stroke-width:1.5} .dg .bxa{fill:var(--dg-fa);stroke:var(--dg-a);stroke-width:2} .dg .bxb{fill:var(--dg-fb);stroke:var(--dg-b);stroke-width:2} .dg .bx2{fill:var(--dg-fa);stroke:none}
.dg .ring{fill:none;stroke:var(--dg-mute);stroke-width:2;stroke-dasharray:6 6}
.dg .dot{fill:var(--dg-a)} .dg .dbar{fill:var(--dg-a)} .dg .dbar2{fill:var(--dg-b)}
.dg .shape{fill:var(--dg-fa);stroke:var(--dg-a);stroke-width:2.5} .dg .shape2{fill:var(--dg-fb);stroke:var(--dg-b);stroke-width:2.5}
.dg .glass{fill:var(--dg-fb);stroke:var(--dg-b);stroke-width:2}
.dg .sq1{fill:var(--dg-fa);stroke:var(--dg-a);stroke-width:2} .dg .sq2{fill:var(--dg-fb);stroke:var(--dg-b);stroke-width:2} .dg .sq3{fill:var(--dg-fc);stroke:var(--dg-c);stroke-width:2}
.dg .bs{fill:var(--dg-fa);stroke:var(--dg-a)} .dg .bd{fill:var(--dg-fb);stroke:var(--dg-b)} .dg .bp{fill:var(--dg-fc);stroke:var(--dg-c)} .dg .bf{fill:var(--dg-fd);stroke:var(--dg-line)}
.dg .pie{stroke:var(--dg-fill);stroke-width:2} .dg .p0{fill:var(--dg-fa)} .dg .p1{fill:var(--dg-fb)} .dg .p2{fill:var(--dg-fc)} .dg .p3{fill:var(--dg-fd)}
.stage-dg{width:100%;display:flex;justify-content:center}
.stage-dg .dg{max-height:clamp(170px,36vw,360px);width:auto;max-width:100%}
.stage.has-dg{justify-content:flex-start;gap:6px;padding-block:14px}
.dgwrap{max-width:720px;margin:6px auto}
.dgcard figcaption{text-align:center}

/* progress charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-top:14px;align-items:start}
@media (max-width:440px){.charts{grid-template-columns:1fr}}
.hm-card{grid-column:1/-1}
.dev{letter-spacing:0!important;text-transform:none}
.hm-card .hm{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));column-gap:24px}
.charts .sheet{min-width:0}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .grid{stroke:var(--rule);stroke-width:1} .chart .goal{stroke:var(--green);stroke-dasharray:4 4}
.chart .axt{fill:var(--ink-3);font-size:12px;font-family:var(--body)} .chart .goalt{fill:var(--green);font-weight:700}
.chart .lab{fill:var(--ink-2);font-size:14px;font-family:var(--body)} .chart .val{fill:var(--ink);font-weight:700;font-size:13px;font-family:var(--body)}
.chart .cbar{fill:var(--blue)} .chart .cline{stroke:var(--blue);stroke-width:2;fill:none} .chart .carea{fill:var(--blue);opacity:.12} .chart .cdot{fill:var(--blue);stroke:var(--sheet);stroke-width:2}
.chart [data-tip]{cursor:default} .chart [data-tip]:hover .cbar{opacity:.85}
.hm{display:grid;gap:6px;margin-top:10px}
.hm-row{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center}
.hm-l{font-size:13px;color:var(--ink-2)}
.hm-cells{display:flex;flex-wrap:wrap;gap:4px}

</head><body>
<header class="top"><div class="top-in">
  <button class="brand" data-go="home" aria-label="SSC Saathi home"><b>SSC Saathi</b><span>इयत्ता १० वी</span></button>
  <button class="btn" id="installBtn" hidden style="padding:5px 12px">ॲप इंस्टॉल करा</button><button class="btn" id="userBtn" hidden></button>
  <nav class="tabs" aria-label="Main">
    <button class="tab" data-go="home">शिका</button>
    <button class="tab" data-go="check">उत्तरपत्रिका</button>
    <button class="tab" data-go="ask">शंका</button>
    <button class="tab" data-go="plan">माझी प्रगती</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<script src="config.js"></script>
<script>
// Website build: talks to ssc-backend instead of Claude's built-in capability.
window.SSC_WEB = true;
function parseLooseJSON(t){
  try { return JSON.parse(t); } catch(e) {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch(e) {} }
  const a = Math.min(...["{", "["].map(c => { const i = t.indexOf(c); return i < 0 ? Infinity : i; }));
  const b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a < b) { try { return JSON.parse(t.slice(a, b + 1)); } catch(e) {} }
  throw {code: "invalid_json", text: t};
}
async function shrinkImage(file){
  // Downscale phone photos to ~1600px JPEG so uploads are fast on mobile data.
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) throw {code: "image_rejected"};
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return {media_type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1]};
}
function makeWebAI(){
  const base = (window.SSC_CONFIG && SSC_CONFIG.api || "").replace(/\/$/, "");
  async function call(input, opts = {}, json = false){
    if (!store.code) throw {code: "need_code"};
    const images = [];
    if (opts.images) for (const f of Array.from(opts.images)) images.push(await shrinkImage(f));
    const turns = typeof input === "string" ? [{role: "user", content: input}] : input;
    let r;
    try {
      r = await fetch(base + "/sample", {method: "POST", signal: opts.signal,
        headers: {"Content-Type": "application/json", "X-Access-Code": store.code},
        body: JSON.stringify({turns, images, tier: opts.modelTier || "default", json})});
    } catch(e) { throw {code: e && e.name === "AbortError" ? "cancelled" : "network"}; }
    if (r.status === 401) throw {code: "bad_code"};
    if (r.status === 429) throw {code: "quota"};
    if (r.status === 413) throw {code: "prompt_too_large"};
    if (!r.ok) throw {code: "upstream_error"};
    const d = await r.json();
    if (opts.onText) opts.onText({text: d.text, delta: d.text});
    return d.text;
  }
  const f = async (input, opts) => ({text: await call(input, opts), truncated: false});
  f.json = async (input, opts) => parseLooseJSON(await call(input, opts, true));
  f.limits = async () => ({maxPromptBytes: 262144, images: {maxCount: 5, maxInputBytes: 20e6, mediaTypes: ["image/jpeg", "image/png", "image/webp"]}});
  return f;
}
// Android install button + offline service worker
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; const b = document.getElementById("installBtn"); if (b) b.hidden = false; });
document.addEventListener("click", async e => {
  if (!e.target.closest("#installBtn") || !installEvt) return;
  installEvt.prompt(); await installEvt.userChoice.catch(() => null); installEvt = null; e.target.closest("#installBtn").hidden = true;
});
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
// Website build only: student login (name + class code), progress sync, teacher dashboard.
const SYNC_KEYS = ["examDate", "watched", "quiz", "read", "checks", "bd", "bdOpen", "last"];
function apiBase(){ return ((window.SSC_CONFIG && SSC_CONFIG.api) || "").replace(/\/$/, ""); }
function progressOf(st){ const p = {}; SYNC_KEYS.forEach(k => { if (st[k] !== undefined) p[k] = st[k]; }); p.checks = (p.checks || []).slice(-30); return p; }
function mergeProgress(local, srv){
  srv = srv || {};
  const out = {};
  out.quiz = Object.assign({}, srv.quiz); for (const [k, v] of Object.entries(local.quiz || {})) out.quiz[k] = Math.max(v, out.quiz[k] ?? 0);
  out.watched = Object.assign({}, srv.watched, local.watched);
  out.read = Object.assign({}, srv.read, local.read);
  out.bdOpen = Object.assign({}, srv.bdOpen, local.bdOpen);
  out.bd = Object.assign({}, srv.bd); for (const [k, v] of Object.entries(local.bd || {})) out.bd[k] = [...new Set([...(out.bd[k] || []), ...v])];
  const seen = new Set(); out.checks = [...(srv.checks || []), ...(local.checks || [])].filter(c => { const k = [c.date, c.subject, c.got, c.total].join("|"); if (seen.has(k)) return false; seen.add(k); return true; }).slice(-30);
  out.examDate = local.examDate || srv.examDate || "";
  out.last = local.last || srv.last || null;
  return out;
}
let syncTimer = 0, syncing = false;
async function pushProgress(){
  if (!store.student || !store.code || syncing) return;
  syncing = true;
  try {
    const r = await fetch(apiBase() + "/progress", {method: "PUT", headers: {"Content-Type": "application/json", "X-Access-Code": store.code},
      body: JSON.stringify({name: store.student, progress: progressOf(store)})});
    if (r.status === 401) { syncing = false; logout("वर्ग कोड बदलला आहे. पुन्हा लॉगिन करा.", true); }
  } catch(e) { /* offline: next save will retry */ }
  syncing = false;
}
window.onStoreSave = () => { if (!store.student) return; clearTimeout(syncTimer); syncTimer = setTimeout(pushProgress, 2500); };
window.addEventListener("pagehide", () => { if (store.student && store.code) { try { fetch(apiBase() + "/progress", {method: "PUT", keepalive: true, headers: {"Content-Type": "application/json", "X-Access-Code": store.code}, body: JSON.stringify({name: store.student, progress: progressOf(store)})}); } catch(e) {} } });

async function logout(msg, skipPush){
  clearTimeout(syncTimer);
  if (!skipPush && store.student && store.code) { syncing = false; await pushProgress(); }
  store.student = ""; store.code = "";
  Object.assign(store, {watched:{}, quiz:{}, read:{}, checks:[], bd:{}, bdOpen:{}, last:null, examDate:""});
  save(); updateUserBtn(); S.view = "home"; render(); if (msg) toast(msg);
}
function updateUserBtn(){
  const b = document.getElementById("userBtn"); if (!b) return;
  b.hidden = !store.student;
  b.textContent = store.student ? "👤 " + store.student.split(" ")[0] + " · बाहेर पडा" : "";
}
document.addEventListener("click", e => {
  if (e.target.closest("#userBtn")) { if (confirmLogout()) logout("तुम्ही बाहेर पडलात. प्रगती सर्व्हरवर जतन आहे."); }
});
function confirmLogout(){
  const b = document.getElementById("userBtn");
  if (b.dataset.arm) { delete b.dataset.arm; return true; }
  b.dataset.arm = "1"; b.textContent = "पुन्हा दाबा: बाहेर पडा?"; setTimeout(() => { delete b.dataset.arm; updateUserBtn(); }, 3000); return false;
}

// Returns true when it rendered the login or teacher screen instead of the app.
function loginGate(){
  updateUserBtn();
  if (S.view === "teacher" || location.hash === "#teacher") { S.view = "teacher"; renderTeacher(); return true; }
  if (!store.student) { renderLogin(); return true; }
  return false;
}
function renderLogin(msg){
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", "false"));
  app().innerHTML = `
  <div class="login sheet pad">
    <span class="eyebrow">विद्यार्थी लॉगिन</span>
    <h1 style="margin:4px 0 6px">SSC Saathi मध्ये स्वागत!</h1>
    <p class="muted small" style="margin:0 0 14px">तुमचे पूर्ण नाव आणि शिक्षकांनी दिलेला वर्ग कोड टाका. तुमची प्रगती सर्व्हरवर जतन होईल — कोणत्याही फोनवर हेच नाव व कोड टाकून पुढे चालू ठेवा.</p>
    <form id="loginForm" style="display:grid;gap:12px">
      <div class="field"><label for="lgName">विद्यार्थ्याचे पूर्ण नाव</label><input id="lgName" autocomplete="name" maxlength="60" placeholder="उदा. Asha Patil" value="${esc(store.lastName || "")}" required></div>
      <div class="field"><label for="lgCode">वर्ग कोड</label><input id="lgCode" autocomplete="off" autocapitalize="characters" placeholder="उदा. SSC-2027" required></div>
      <button class="btn red" id="lgGo" type="submit" style="justify-self:start">लॉगिन करा</button>
      <div id="lgMsg" class="small" role="status">${msg ? esc(msg) : ""}</div>
    </form>
    <p class="small muted" style="margin:16px 0 0">टीप: नाव नेहमी एकाच पद्धतीने लिहा (उदा. "Asha Patil"), म्हणजे तुमची प्रगती एकत्र राहील. <a href="#teacher" id="toTeacher">शिक्षक लॉगिन →</a></p>
  </div>`;
  $("#toTeacher").onclick = e => { e.preventDefault(); location.hash = "teacher"; S.view = "teacher"; render(); };
  $("#loginForm").onsubmit = async e => {
    e.preventDefault();
    const name = $("#lgName").value.replace(/\s+/g, " ").trim(), code = $("#lgCode").value.trim(), m = $("#lgMsg"), b = $("#lgGo");
    if (name.length < 2) { m.textContent = "पूर्ण नाव टाका."; return; }
    if (!code) { m.textContent = "वर्ग कोड टाका."; return; }
    b.disabled = true; m.textContent = "लॉगिन होत आहे… (पहिल्यांदा सर्व्हर सुरू व्हायला 1 मिनिट लागू शकतो)";
    try {
      const r = await fetch(apiBase() + "/login", {method: "POST", headers: {"Content-Type": "application/json", "X-Access-Code": code}, body: JSON.stringify({name})});
      if (r.status === 401) { m.textContent = "वर्ग कोड चुकीचा आहे. शिक्षकांकडून योग्य कोड घ्या."; b.disabled = false; return; }
      if (!r.ok) { m.textContent = "सर्व्हरमध्ये अडचण (" + r.status + "). थोड्या वेळाने पुन्हा प्रयत्न करा."; b.disabled = false; return; }
      const d = await r.json();
      Object.assign(store, mergeProgress(store, d.progress), {student: d.name, code, lastName: d.name});
      save(); pushProgress(); updateUserBtn();
      toast(d.new ? `स्वागत, ${d.name}!` : `पुन्हा स्वागत, ${d.name}! प्रगती आणली.`);
      S.view = "home"; render();
    } catch(err) { m.textContent = "सर्व्हरशी संपर्क झाला नाही. इंटरनेट तपासा आणि पुन्हा प्रयत्न करा."; b.disabled = false; }
  };
}

// ---------- teacher dashboard ----------
const TD = {key: "", data: null, cls: "", open: null, sort: "name"};
try { TD.key = sessionStorage.getItem("ssc-teacher") || ""; } catch(e) {}
function summarize(p){
  const all = SUBJECTS.flatMap(s => s.ch);
  const q = p.quiz || {}, scores = Object.values(q);
  const checks = p.checks || [], last = checks[checks.length - 1];
  return {
    watched: Object.keys(p.watched || {}).length, total: all.length,
    mastered: all.filter(c => (q[c.id] ?? -1) >= 80).length,
    tried: scores.length, avg: scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null,
    sheets: checks.length, lastPct: last && +last.total ? Math.round(last.got / last.total * 100) : null,
    board: Object.values(p.bd || {}).reduce((a, v) => a + v.length, 0)
  };
}
function ago(ts){ const d = (Date.now() / 1000 - ts) / 86400; return d < 1 ? "आज" : d < 2 ? "काल" : Math.floor(d) + " दिवसांपूर्वी"; }
async function loadTeacher(){
  const r = await fetch(apiBase() + "/teacher", {headers: {"X-Teacher-Key": TD.key}});
  if (r.status === 401) throw new Error("शिक्षक पासवर्ड चुकीचा आहे.");
  if (r.status === 503) throw new Error("शिक्षक डॅशबोर्ड अजून सुरू केलेला नाही (सर्व्हरवर SSC_TEACHER_KEY सेट करा).");
  if (!r.ok) throw new Error("सर्व्हरमध्ये अडचण (" + r.status + ").");
  TD.data = (await r.json()).students;
}
function renderTeacher(msg){
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", "false"));
  const back = `<a href="#" id="tdBack" class="small">← विद्यार्थी ॲपकडे परत</a>`;
  if (!TD.data){
    app().innerHTML = `<div class="login sheet pad">${back}<span class="eyebrow" style="display:block;margin-top:10px">शिक्षक डॅशबोर्ड</span>
      <h1 style="margin:4px 0 12px">वर्गाची प्रगती पहा</h1>
      <form id="tdForm" style="display:grid;gap:12px"><div class="field"><label for="tdKey">शिक्षक पासवर्ड</label><input id="tdKey" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" style="justify-self:start" id="tdGo">उघडा</button><div id="tdMsg" class="small" role="status">${msg ? esc(msg) : ""}</div></form></div>`;
    bindBack();
    $("#tdForm").onsubmit = async e => {
      e.preventDefault(); TD.key = $("#tdKey").value; $("#tdGo").disabled = true; $("#tdMsg").textContent = "लोड होत आहे…";
      try { await loadTeacher(); try { sessionStorage.setItem("ssc-teacher", TD.key); } catch(e) {} renderTeacher(); }
      catch(err) { $("#tdMsg").textContent = err.message || "सर्व्हरशी संपर्क झाला नाही."; $("#tdGo").disabled = false; }
    };
    if (TD.key && !msg) { loadTeacher().then(() => renderTeacher()).catch(err => { TD.key = ""; try { sessionStorage.removeItem("ssc-teacher"); } catch(e) {} renderTeacher(err.message); }); }
    return;
  }
  const classes = [...new Set(TD.data.map(s => s.code))];
  const rows = TD.data.filter(s => !TD.cls || s.code === TD.cls).map(s => Object.assign({}, s, summarize(s.progress)));
  const by = {name: (a, b) => a.name.localeCompare(b.name), mastered: (a, b) => b.mastered - a.mastered, avg: (a, b) => (b.avg ?? -1) - (a.avg ?? -1), active: (a, b) => b.updated_at - a.updated_at}[TD.sort];
  rows.sort(by);
  const n = rows.length || 1;
  const avgM = Math.round(rows.reduce((a, r) => a + r.mastered, 0) / n), avgQ = rows.filter(r => r.avg != null), act = rows.filter(r => Date.now() / 1000 - r.updated_at < 7 * 86400).length;
  app().innerHTML = `
  <div class="chhead" style="margin-top:14px">${back}<span class="eyebrow" style="display:block;margin-top:8px">शिक्षक डॅशबोर्ड</span><h1>वर्गाची प्रगती</h1></div>
  <div class="row" style="gap:10px;margin:10px 0 14px">
    <label class="small">वर्ग कोड <select id="tdCls">${["", ...classes].map(c => `<option value="${esc(c)}" ${c === TD.cls ? "selected" : ""}>${c ? esc(c.toUpperCase()) : "सर्व वर्ग"}</option>`).join("")}</select></label>
    <label class="small">क्रम <select id="tdSort">${[["name","नाव"],["mastered","पक्की प्रकरणे"],["avg","सरासरी गुण"],["active","अलीकडे सक्रिय"]].map(([k, l]) => `<option value="${k}" ${k === TD.sort ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    <button class="btn" id="tdRefresh">↻ ताजे करा</button><button class="btn" id="tdCsv">Excel (CSV) डाउनलोड</button><button class="btn" id="tdOut">शिक्षक लॉगआउट</button>
  </div>
  <div class="tdstats">
    <div class="sheet pad"><div class="eyebrow">विद्यार्थी</div><b class="score">${rows.length}</b></div>
    <div class="sheet pad"><div class="eyebrow">या आठवड्यात सक्रिय</div><b class="score">${act}</b></div>
    <div class="sheet pad"><div class="eyebrow">सरासरी पक्की प्रकरणे</div><b class="score">${avgM}<span class="small muted">/62</span></b></div>
    <div class="sheet pad"><div class="eyebrow">सरासरी MCQ गुण</div><b class="score">${avgQ.length ? Math.round(avgQ.reduce((a, r) => a + r.avg, 0) / avgQ.length) + "%" : "–"}</b></div>
  </div>

function detail(r){
  const p = r.progress, q = p.quiz || {};
  return `<div class="tdgrid">${SUBJECTS.map(s => {
    const done = s.ch.filter(c => (q[c.id] ?? -1) >= 80).length, tried = s.ch.filter(c => q[c.id] != null);
    const weak = tried.filter(c => q[c.id] < 50).map(c => c.t);
    return `<div><b>${esc(s.short)}</b> <span class="small muted">${done}/${s.ch.length} पक्की</span><div class="tdbar"><i style="width:${done / s.ch.length * 100}%;background:var(--${s.hue})"></i></div>${weak.length ? `<div class="small" style="color:var(--red)">कमकुवत: ${esc(weak.slice(0, 3).join(", "))}</div>` : ""}</div>`;
  }).join("")}</div>
  ${(p.checks || []).length ? `<div class="small" style="margin-top:8px"><b>उत्तरपत्रिका:</b> ${(p.checks || []).slice(-5).reverse().map(c => `${esc(c.date)} ${esc(c.subject)} ${esc(c.got)}/${esc(c.total)}`).join(" · ")}</div>` : ""}
  ${p.examDate ? `<div class="small muted">परीक्षा तारीख: ${esc(p.examDate)}</div>` : ""}`;
}

["Distance formula gives the length of a segment.","Section formula gives the point dividing a segment internally in ratio m : n.","Midpoint is the section formula with ratio 1 : 1.","Slope m = tan θ, where θ is the angle the line makes with the positive X-axis.","Parallel lines have equal slopes. Points are collinear if slopes between them are equal.","Slope of X-axis is 0; slope of Y-axis is not defined."],
["d = √[(x₂ − x₁)² + (y₂ − y₁)²]","Section: ((mx₂ + nx₁)/(m + n), (my₂ + ny₁)/(m + n))","Midpoint: ((x₁ + x₂)/2, (y₁ + y₂)/2)","Centroid: ((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3)","Slope m = (y₂ − y₁)/(x₂ − x₁)"],
"Write the formula first, then substitute. Keep track of negative signs in coordinates.",
[["Distance between (0, 0) and (3, 4) is:",["5","7","25","1"],0,"√(9 + 16) = 5."],
["Midpoint of (2, 6) and (4, 8) is:",["(3, 7)","(6, 14)","(2, 2)","(1, 1)"],0,"((2+4)/2, (6+8)/2)."],
["Slope of the line through (1, 2) and (3, 6) is:",["1","2","4","1/2"],1,"(6 − 2)/(3 − 1) = 2."],
["The slope of a line parallel to the X-axis is:",["1","0","Not defined","−1"],1,"θ = 0°, tan 0° = 0."],
["Centroid of (0, 0), (3, 0), (0, 6) is:",["(1, 2)","(3, 6)","(1, 3)","(2, 1)"],0,"(3/3, 6/3) = (1, 2)."]]),

C("g6","Trigonometry","त्रिकोणमिती",
"Trigonometric identities connect sin, cos, tan and their reciprocals. They are used to solve height-and-distance problems with angles of elevation and depression.",
"त्रिकोणमितीय नित्यसमानता आणि उन्नत कोन व अवनत कोन वापरून उंची-अंतराची उदाहरणे सोडवणे.",
["sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse, tan θ = opposite/adjacent.","cosec, sec and cot are reciprocals of sin, cos and tan.","Angle of elevation: looking up from the horizontal line. Angle of depression: looking down.","Angle of elevation from A to B equals angle of depression from B to A.","Standard values: tan 45° = 1, sin 30° = 1/2, cos 60° = 1/2, tan 60° = √3."],
["sin²θ + cos²θ = 1","1 + tan²θ = sec²θ","1 + cot²θ = cosec²θ","tan θ = sin θ / cos θ"],
"In height–distance problems draw the figure, mark the right angle, and use tan θ most of the time.",
[["sin²θ + cos²θ = ?",["0","1","2","tan²θ"],1,"Fundamental identity."],
["tan 45° = ?",["0","1","√3","1/√3"],1,"Opposite = adjacent at 45°."],
["1 + tan²θ = ?",["sec²θ","cosec²θ","cot²θ","sin²θ"],0,"Second identity."],
["A 10 m pole casts a 10 m shadow. Angle of elevation of the sun:",["30°","45°","60°","90°"],1,"tan θ = 10/10 = 1 → 45°."],
["cosec θ is the reciprocal of:",["cos θ","sin θ","tan θ","sec θ"],1,"cosec θ = 1/sin θ."]]),

C("g7","Mensuration","महत्त्वमापन",
"Surface area and volume of cones, spheres, hemispheres, cylinders and frustums, plus the area of sectors and segments of a circle and arc length.",
"शंकू, गोल, अर्धगोल, वृत्तचिती, शंकूछेद यांचे पृष्ठफळ व घनफळ, तसेच वृत्तपाकळी व वर्तुळखंडाचे क्षेत्रफळ आणि कंसाची लांबी.",
["Slant height of cone l = √(r² + h²).","Frustum: what remains when the top of a cone is cut parallel to its base.","Area of a sector is a fraction θ/360 of the circle.","Segment area = sector area − triangle area.","When one solid is melted and recast, volume stays the same."],
["Cone: V = ⅓πr²h, CSA = πrl","Sphere: V = 4/3 πr³, SA = 4πr²","Hemisphere: V = 2/3 πr³, TSA = 3πr²","Cylinder: V = πr²h, CSA = 2πrh","Frustum: V = ⅓πh(r₁² + r₂² + r₁r₂), CSA = πl(r₁ + r₂)","Sector = (θ/360) × πr²,  Arc = (θ/360) × 2πr"],
"Write units (cm², cm³). In 'melt and recast' questions equate volumes.",
[["Volume of a sphere of radius r is:",["4πr²","4/3 πr³","2/3 πr³","πr²h"],1,"Standard formula."],
["Total surface area of a solid hemisphere:",["2πr²","3πr²","4πr²","πr²"],1,"Curved 2πr² + base πr²."],
["Slant height of a cone with r = 6, h = 8:",["10","14","48","12"],0,"√(36 + 64) = 10."],
["Area of a sector with θ = 90° and r = 14 cm (π = 22/7):",["154 cm²","616 cm²","44 cm²","77 cm²"],0,"(90/360) × 22/7 × 196 = 154."],
["When a solid is melted and recast into another shape, what stays the same?",["Surface area","Volume","Height","Radius"],1,"Volume is conserved."]])
];
const SCI1 = [
C("s1","Gravitation","गुरुत्वाकर्षण",
"Every object in the universe attracts every other object. Newton's universal law of gravitation explains falling objects, the motion of the Moon and planets, and why we have weight.",
"विश्वातील प्रत्येक वस्तू इतर प्रत्येक वस्तूला आकर्षित करते. न्यूटनच्या गुरुत्वाकर्षणाच्या नियमाने पडणाऱ्या वस्तू, चंद्र व ग्रहांची गती आणि वजन स्पष्ट होते.",
["Kepler's laws: orbits are ellipses, equal areas in equal times, T² ∝ r³.","Newton's law: force ∝ product of masses and ∝ 1/(distance)².","g decreases with height and depth, and is slightly more at the poles than at the equator.","Mass stays the same everywhere; weight (mg) changes with g.","Free fall: motion only under gravity. All objects fall at the same rate in vacuum.","Escape velocity of Earth ≈ 11.2 km/s."],
["F = G m₁m₂ / r²","G = 6.67 × 10⁻¹¹ N m²/kg²","g = GM / R² ≈ 9.8 m/s²","W = mg","v_esc = √(2GM/R)","v = u + gt,  s = ut + ½gt²,  v² = u² + 2gs"],

["Weight of an object on the Moon compared to Earth is about:",["Same","1/6","6 times","Zero"],1,"Moon's g is about 1/6 of Earth's."],
["Escape velocity from Earth is about:",["7.9 km/s","11.2 km/s","3 km/s","30 km/s"],1,"About 11.2 km/s."],

C("s2","Periodic Classification of Elements","मूलद्रव्यांचे आवर्ती वर्गीकरण",
"Scientists tried to arrange elements by properties: Döbereiner's triads, Newlands' octaves, Mendeleev's table based on atomic mass, and finally the modern periodic table based on atomic number.",
"मूलद्रव्यांची मांडणी: डोबेरायनरची त्रिके, न्यूलँड्सचा अष्टकाचा नियम, अणुवस्तुमानावर आधारित मेंडेलीव्हची सारणी आणि अणुअंकावर आधारित आधुनिक आवर्त सारणी.",
["Döbereiner: in a triad, the middle element's atomic mass is about the average of the other two.","Newlands' octaves worked only up to calcium.","Mendeleev arranged by atomic mass and left gaps for undiscovered elements (eka-aluminium = gallium).","Moseley showed atomic number is the basis: modern periodic law.","Modern table: 7 periods, 18 groups, s, p, d and f blocks.","Across a period atomic radius decreases and metallic character decreases; down a group both increase."],
["Valency of group 1 = 1, group 2 = 2, group 13 = 3, group 14 = 4","Number of shells = period number"],
"Learn the trends as a table: atomic radius, valency, metallic character, across a period and down a group.",
[["The modern periodic table is based on:",["Atomic mass","Atomic number","Number of neutrons","Density"],1,"Moseley's modern periodic law."],
["Number of groups in the modern periodic table:",["7","8","18","16"],2,"18 vertical columns."],
["Mendeleev's eka-aluminium was later called:",["Germanium","Gallium","Scandium","Aluminium"],1,"Gallium was discovered later."],
["Across a period from left to right, atomic radius:",["Increases","Decreases","Stays the same","First increases then decreases"],1,"Nuclear charge increases and pulls electrons closer."],
["Newlands' law of octaves was applicable only up to:",["Sodium","Calcium","Iron","Uranium"],1,"It failed after calcium."]]),

C("s3","Chemical Reactions and Equations","रासायनिक अभिक्रिया व समीकरणे",
"A chemical reaction changes reactants into new products. Reactions are written as balanced chemical equations and are grouped into types such as combination, decomposition, displacement and redox.",
"रासायनिक अभिक्रियेत अभिकारकांपासून नवीन उत्पादिते तयार होतात. अभिक्रिया संतुलित रासायनिक समीकरणाने लिहितात.",
["A balanced equation has equal numbers of each atom on both sides (law of conservation of mass).","Combination: A + B → AB. Decomposition: AB → A + B.","Displacement: a more reactive element displaces a less reactive one. Double displacement: ions exchange.","Exothermic reactions give out heat; endothermic reactions absorb heat.","Oxidation: gain of oxygen or loss of hydrogen/electrons. Reduction is the opposite. Both together: redox.","Corrosion (rusting of iron) and rancidity (oily food going bad) are effects of oxidation."],
["2H₂ + O₂ → 2H₂O (combination)","CaCO₃ → CaO + CO₂ (decomposition, on heating)","Fe + CuSO₄ → FeSO₄ + Cu (displacement)","NaCl + AgNO₃ → AgCl↓ + NaNO₃ (double displacement)","CuO + H₂ → Cu + H₂O (redox)"],
"Practise balancing equations every day. In 'give reasons' questions name the type of reaction.",
[["CaCO₃ → CaO + CO₂ is which type of reaction?",["Combination","Decomposition","Displacement","Double displacement"],1,"One reactant breaks into two products."],
["Rusting of iron is an example of:",["Reduction","Oxidation (corrosion)","Neutralization","Decomposition by light"],1,"Iron reacts with oxygen and moisture."],
["In CuO + H₂ → Cu + H₂O, the substance oxidised is:",["CuO","H₂","Cu","H₂O"],1,"Hydrogen gains oxygen."],
["Dissolving ammonium chloride in water makes it cold. The process is:",["Exothermic","Endothermic","Redox","Displacement"],1,"It absorbs heat from the water."],
["Fe + CuSO₄ → FeSO₄ + Cu is:",["Combination","Displacement","Decomposition","Double displacement"],1,"Iron displaces copper."]]),

C("s4","Effects of Electric Current","विद्युतधारेचे परिणाम",
"Electric current produces heat (heating effect) and a magnetic field (magnetic effect). A changing magnetic field can in turn produce current (electromagnetic induction), which is how generators work.",
"विद्युतधारेमुळे उष्णता व चुंबकीय क्षेत्र निर्माण होते. बदलत्या चुंबकीय क्षेत्रामुळे विद्युतधारा निर्माण होते (विद्युतचुंबकीय प्रवर्तन).",
["Joule's law: heat produced H = I²Rt. Used in heaters, irons and fuses.","Commercial unit of electrical energy: kilowatt hour (kWh) = 1 unit = 3.6 × 10⁶ J.","Right hand thumb rule gives the direction of the magnetic field around a current-carrying wire.","Fleming's left hand rule: direction of force on a conductor (electric motor).","Fleming's right hand rule: direction of induced current (electric generator).","Domestic supply in India is AC at 220 V and 50 Hz."],
["H = I²Rt","P = VI = I²R = V²/R","Energy (kWh) = P (kW) × t (h)","1 kWh = 3.6 × 10⁶ J"],
"Remember: motor = Left hand (force), generator = Right hand (current). Draw labelled diagrams of motor and generator.",
[["Heat produced in a conductor is given by:",["H = IRt","H = I²Rt","H = IR²t","H = V/I"],1,"Joule's law of heating."],
["1 kWh equals:",["3.6 × 10³ J","3.6 × 10⁶ J","1000 J","36 J"],1,"1000 W × 3600 s."],
["The rule used for an electric motor is:",["Fleming's left hand rule","Fleming's right hand rule","Right hand thumb rule","Ohm's law"],0,"It gives the direction of force."],
["Frequency of AC supply in India:",["60 Hz","50 Hz","100 Hz","220 Hz"],1,"Indian mains frequency is 50 Hz."],
["A generator converts:",["Electrical to mechanical energy","Mechanical to electrical energy","Heat to light","Chemical to electrical"],1,"Based on electromagnetic induction."]]),

C("s5","Heat","उष्णता",
"Heat changes the temperature and state of substances. This chapter covers latent heat, specific heat capacity, the unusual behaviour of water, humidity and dew point.",
"उष्णतेमुळे पदार्थाचे तापमान व अवस्था बदलते. अप्रकट उष्मा, विशिष्ट उष्मा धारकता, पाण्याचे असंगत आचरण, आर्द्रता व दवबिंदू यांचा अभ्यास.",
["Latent heat: heat absorbed or released during change of state at constant temperature.","Regelation: ice melts under pressure and refreezes when pressure is removed.","Water has maximum density at 4 °C (anomalous behaviour); shown by Hope's apparatus.","Because of this, lakes freeze from the top and aquatic life survives below.","Dew point: temperature at which air becomes saturated with water vapour.","Specific heat capacity: heat needed to raise 1 kg of a substance by 1 °C. Water has a high value."],
["Q = m c ΔT","Heat lost = Heat gained (calorimetry)","Q = m L (latent heat)","Relative humidity = (actual vapour ÷ vapour needed to saturate) × 100"],
"For 'give scientific reasons' questions about water at 4 °C, mention density and aquatic life.",
[["Water has maximum density at:",["0 °C","4 °C","100 °C","−4 °C"],1,"Anomalous behaviour of water."],
["Apparatus used to show anomalous behaviour of water:",["Calorimeter","Hope's apparatus","Barometer","Thermos flask"],1,"Hope's apparatus."],
["Heat absorbed during a change of state without change in temperature is called:",["Specific heat","Latent heat","Kinetic energy","Dew point"],1,"It is hidden (latent) heat."],
["SI unit of specific heat capacity:",["J/kg °C","J/kg","°C","J"],0,"Joule per kilogram per degree Celsius."],
["Lakes in cold countries freeze:",["From the bottom up","From the top down","All at once","Never"],1,"Water at 4 °C stays at the bottom."]]),

C("s6","Refraction of Light","प्रकाशाचे अपवर्तन",
"Light bends when it passes from one transparent medium to another because its speed changes. This explains dispersion, rainbows, twinkling stars and total internal reflection.",
"प्रकाश एका पारदर्शक माध्यमातून दुसऱ्यात जाताना त्याचा वेग बदलतो म्हणून तो वाकतो. यामुळे अपस्करण, इंद्रधनुष्य, ताऱ्यांचे लुकलुकणे स्पष्ट होते.",
["Light bends towards the normal when going into a denser medium, and away from it in a rarer medium.","Snell's law: sin i / sin r is constant for a pair of media.","Absolute refractive index n = speed of light in vacuum ÷ speed in the medium.","Dispersion: white light splits into seven colours (VIBGYOR) in a prism. Red deviates least, violet most.","Rainbow forms by dispersion, refraction and total internal reflection in water droplets.","Total internal reflection happens when light goes from denser to rarer medium at an angle greater than the critical angle."],
["n = sin i / sin r","n = c / v","₁n₂ = n₂ / n₁","c = 3 × 10⁸ m/s"],
"Draw ray diagrams with arrows and label i, r and the normal. Learn VIBGYOR order.",
[["Refractive index of a medium is:",["v / c","c / v","c × v","1 / c"],1,"Speed in vacuum ÷ speed in medium."],
["Which colour deviates the least in a prism?",["Violet","Blue","Green","Red"],3,"Red has the longest wavelength."],
["Twinkling of stars is due to:",["Reflection","Atmospheric refraction","Dispersion","Scattering only"],1,"Changing air layers bend starlight."],
["Light entering glass from air bends:",["Away from the normal","Towards the normal","Does not bend","Back into air"],1,"Glass is optically denser."],
["Total internal reflection requires light to travel from:",["Rarer to denser medium","Denser to rarer medium","Vacuum to glass","Any medium"],1,"And angle of incidence > critical angle."]]),

C("s7","Lenses","भिंगे",
"Convex lenses converge light and concave lenses diverge it. This chapter covers image formation, the lens formula, magnification, power of a lens, the human eye and its defects.",
"बहिर्गोल भिंग प्रकाश अभिसारी करते, अंतर्गोल भिंग अपसारी करते. प्रतिमा निर्मिती, भिंगाचे सूत्र, विशालन, शक्ती, मानवी डोळा व दृष्टिदोष.",
["Use the Cartesian sign convention: distances measured from the optical centre; along incident light positive.","Focal length of a convex lens is positive; of a concave lens is negative.","Power is measured in dioptre (D); 1 D = 1/m.","Myopia (near-sightedness): corrected by a concave lens.","Hypermetropia (far-sightedness): corrected by a convex lens.","Presbyopia (old age): bifocal lens. Near point of a normal eye = 25 cm."],
["1/v − 1/u = 1/f","m = v/u = h₂/h₁","P = 1/f (f in metres)","Combined power P = P₁ + P₂"],
"In numericals always put signs: object distance u is negative. Draw ray diagrams for all six convex-lens positions.",
[["Unit of power of a lens:",["Metre","Dioptre","Watt","Joule"],1,"P = 1/f in metres gives dioptre."],
["Myopia is corrected using:",["Convex lens","Concave lens","Bifocal lens","Cylindrical lens"],1,"Concave lens diverges rays."],
["Power of a lens with f = 50 cm (convex):",["+2 D","−2 D","+0.5 D","+50 D"],0,"P = 1/0.5 = +2 D."],
["Near point of a normal human eye:",["25 cm","1 m","Infinity","10 cm"],0,"Least distance of distinct vision."],
["Lens formula is:",["1/v + 1/u = 1/f","1/v − 1/u = 1/f","v − u = f","m = u/v"],1,"With the Cartesian sign convention."]]),

C("s8","Metallurgy","धातुविज्ञान",
"Metallurgy is the science of extracting metals from ores and refining them. It also covers the properties of metals and non-metals, the reactivity series and prevention of corrosion.",
"खनिजांपासून धातू मिळवणे व त्यांचे शुद्धीकरण करणे म्हणजे धातुविज्ञान. धातू-अधातूंचे गुणधर्म, अभिक्रियाशीलता श्रेणी व क्षरण प्रतिबंध.",
["Metals are lustrous, malleable, ductile and good conductors. Mercury is a liquid metal.","Reactivity series: K > Na > Ca > Mg > Al > Zn > Fe > Pb > H > Cu > Hg > Ag > Au.","Ore = mineral from which a metal is profitably extracted. Gangue = earthy impurities.","Concentration: gravity separation, magnetic separation, froth floatation, leaching.","Roasting heats sulphide ores in air; calcination heats carbonate ores without air.","Aluminium: Bayer's process gives alumina; Hall–Héroult electrolysis gives aluminium.","Corrosion prevention: painting, galvanizing (zinc coat), tinning, anodizing, alloying."],
["2ZnS + 3O₂ → 2ZnO + 2SO₂ (roasting)","ZnCO₃ → ZnO + CO₂ (calcination)","ZnO + C → Zn + CO (reduction)"],
"Learn diagrams: froth floatation, electrolytic refining and Hall–Héroult cell. They are asked often.",
[["Froth floatation is used to concentrate:",["Oxide ores","Sulphide ores","Carbonate ores","Native metals"],1,"Sulphide ore particles stick to froth."],
["Heating a carbonate ore in absence of air is:",["Roasting","Calcination","Smelting","Leaching"],1,"Calcination removes CO₂."],
["Galvanizing is coating iron with:",["Tin","Zinc","Copper","Chromium"],1,"Zinc protects iron from rusting."],
["Which metal is a liquid at room temperature?",["Sodium","Mercury","Gallium","Lead"],1,"Mercury (Hg)."],
["The most reactive metal among these:",["Copper","Iron","Potassium","Zinc"],2,"Potassium is at the top of the series."]]),

C("s9","Carbon Compounds","कार्बनी संयुगे",
"Carbon forms millions of compounds because of tetravalency and catenation. The chapter covers hydrocarbons, functional groups, homologous series, IUPAC names, ethanol, ethanoic acid and polymers.",
"चतु:संयुजा व शृंखलाबंधन या गुणधर्मांमुळे कार्बन लाखो संयुगे बनवतो. हायड्रोकार्बन, क्रियात्मक गट, समजातीय श्रेणी, IUPAC नावे, बहुवारिके.",
["Carbon has valency 4 and forms covalent bonds by sharing electrons.","Catenation: carbon atoms join to form long chains, branches and rings.","Alkanes CₙH₂ₙ₊₂ (single bonds), alkenes CₙH₂ₙ (double bond), alkynes CₙH₂ₙ₋₂ (triple bond).","Members of a homologous series differ by –CH₂– (14 u).","Functional groups: –OH alcohol, –CHO aldehyde, >C=O ketone, –COOH carboxylic acid, –X halogen.","Esterification: acid + alcohol → ester + water. Saponification makes soap.","Addition of hydrogen to vegetable oils (hydrogenation) uses a nickel catalyst."],
["CH₃COOH + C₂H₅OH → CH₃COOC₂H₅ + H₂O (conc. H₂SO₄)","CH₄ + 2O₂ → CO₂ + 2H₂O + heat","CH₂=CH₂ + H₂ → CH₃–CH₃ (Ni catalyst)"],
"Practise drawing structural formulae and naming them by IUPAC rules (prop-, but-, pent-).",
[["The general formula of alkenes is:",["CₙH₂ₙ₊₂","CₙH₂ₙ","CₙH₂ₙ₋₂","CₙHₙ"],1,"One double bond."],
["Consecutive members of a homologous series differ by:",["–CH₃","–CH₂–","–OH","–COOH"],1,"A –CH₂– unit (14 u)."],
["Functional group of carboxylic acids:",["–OH","–CHO","–COOH","–X"],2,"Carboxyl group."],
["The property of carbon to form long chains is:",["Isomerism","Catenation","Tetravalency","Polymerisation"],1,"Self-linking of carbon atoms."],
["IUPAC name of CH₃CH₂OH:",["Methanol","Ethanol","Propanol","Ethanoic acid"],1,"Two carbons + –OH = ethanol."]]),

C("s10","Space Missions","अवकाश मोहिमा",
"Artificial satellites are placed in orbits for communication, weather, navigation and research. India's ISRO launches them using PSLV and GSLV and has sent missions to the Moon and Mars.",
"संदेशवहन, हवामान, दिशादर्शन व संशोधनासाठी कृत्रिम उपग्रह कक्षेत सोडले जातात. इस्रो PSLV व GSLV प्रक्षेपकांच्या साहाय्याने उपग्रह प्रक्षेपित करते.",
["Types of satellites: weather, communication, broadcast, navigation, military, earth observation.","Low Earth orbit: about 180–2000 km. Medium: about 2000–35780 km. High Earth (geostationary) orbit: about 35780 km above Earth.","A geostationary satellite takes 24 hours to orbit, so it appears fixed above a place.","Critical velocity keeps a satellite in a circular orbit; it decreases with height.","Chandrayaan missions studied the Moon; Mangalyaan (Mars Orbiter Mission, 2013) reached Mars orbit on the first attempt.","Space debris from old satellites and rockets is a growing danger."],

"Newspapers, periodicals, radio and television are mass media. They spread information, shaped the freedom movement and are useful sources of history.",
"वर्तमानपत्रे, नियतकालिके, आकाशवाणी व दूरदर्शन ही प्रसारमाध्यमे आहेत. त्यांनी माहिती पसरवली, स्वातंत्र्यलढ्याला दिशा दिली आणि ती इतिहासाची साधने आहेत.",
["The first newspaper in India: 'Bengal Gazette' (1780) by James Augustus Hicky.","The first Marathi newspaper: 'Darpan' (1832) by Balshastri Jambhekar.","Lokmanya Tilak published 'Kesari' (Marathi) and 'Maratha' (English).","Radio broadcasting became 'All India Radio' in 1936; it is also called Akashvani.","Television (Doordarshan) began in India in 1959.","Media must be used critically: check facts and sources."],
[],
"Memorise the first newspapers with year and founder. They appear in fill-in-the-blanks.",
[["The first Marathi newspaper 'Darpan' was started by:",["Lokmanya Tilak","Balshastri Jambhekar","Gopal Ganesh Agarkar","Mahatma Phule"],1,"In 1832."],
["'Bengal Gazette' was started in:",["1780","1832","1857","1947"],0,"By James Augustus Hicky."],
["'Kesari' was published by:",["Lokmanya Tilak","Gandhiji","Nehru","Ranade"],0,"With 'Maratha' in English."],
["Television broadcasting in India began in:",["1936","1959","1975","1991"],1,"Doordarshan, Delhi."],
["All India Radio is also known as:",["Doordarshan","Akashvani","Prasar Bharati only","Vividh Bharati only"],1,"Akashvani."]]),

C("h6","Entertainment and History","मनोरंजनाची माध्यमे आणि इतिहास",
"Entertainment such as folk performances, theatre and cinema has a history of its own and reflects society's changes.",
"लोककला, रंगभूमी, चित्रपट अशा मनोरंजनाच्या माध्यमांना स्वतःचा इतिहास आहे आणि ती समाजातील बदल दर्शवतात.",
["Folk performing arts of Maharashtra: tamasha, bharud, kirtan, powada, gondhal.","Vishnudas Bhave is called the father of Marathi theatre; his play 'Sita Swayamvar' was staged in 1843.","Sangeet natak (musical drama) became very popular in Marathi theatre.","Dadasaheb Phalke made India's first full-length feature film 'Raja Harishchandra' (1913).","'Alam Ara' (1931) was the first Indian talkie (sound film).","Cinema is a source of social history and offers many careers."],
[],
"Learn firsts with dates: 1843 (Marathi stage), 1913 (first film), 1931 (first talkie).",
[["Father of Marathi theatre:",["Vishnudas Bhave","Dadasaheb Phalke","Balgandharva","P. L. Deshpande"],0,"'Sita Swayamvar', 1843."],
["India's first full-length feature film:",["Alam Ara","Raja Harishchandra","Sant Tukaram","Mother India"],1,"By Dadasaheb Phalke, 1913."],
["The first Indian talkie was:",["Raja Harishchandra","Alam Ara","Ayodhyecha Raja","Shyamchi Aai"],1,"Released in 1931."],
["A powada is a:",["Ballad praising heroes","Dance form from Kerala","Type of painting","Musical instrument"],0,"Heroic folk song of Maharashtra."],
["'Sita Swayamvar' was staged in:",["1843","1913","1931","1857"],0,"Start of modern Marathi theatre."]]),

C("h7","Sports and History","खेळ आणि इतिहास",
"Sports have a long history, from traditional games to the modern Olympics. They build health and unity and offer careers.",
"पारंपरिक खेळांपासून आधुनिक ऑलिंपिकपर्यंत खेळांना मोठा इतिहास आहे. खेळांमुळे आरोग्य व एकता वाढते आणि करिअरच्या संधी मिळतात.",
["Sports are classed as indoor and outdoor, and as individual and team games.","Traditional Indian games: kho-kho, kabaddi, mallakhamb, atya-patya, wrestling (kusti).","The modern Olympic Games began in 1896 in Athens.","Khashaba Jadhav from Maharashtra won a bronze medal in wrestling at the 1952 Helsinki Olympics, independent India's first individual Olympic medal.","Sports journalism, coaching, physiotherapy and sports management are careers.","Sports equipment, rules and records are sources of history."],
[],
"Remember Khashaba Jadhav and 1952: a common question from Maharashtra board papers.",
[["Khashaba Jadhav won an Olympic medal in:",["Hockey","Wrestling","Shooting","Athletics"],1,"Bronze at Helsinki, 1952."],
["The modern Olympics began in:",["1896","1952","1900","1948"],0,"Athens, Greece."],
["Mallakhamb is a traditional sport of:",["Maharashtra","Kerala","Punjab","Assam"],0,"Gymnastics on a wooden pole."],
["Kho-kho is a:",["Indoor individual game","Outdoor team game","Board game","Water sport"],1,"Traditional Indian team game."],
["Which is an indoor game?",["Chess","Football","Cricket","Kabaddi"],0,"Played on a board."]]),

C("h8","Tourism and History","पर्यटन आणि इतिहास",
"People have travelled for pilgrimage, trade and learning since ancient times. Tourism today is an industry that also helps preserve history.",
"प्राचीन काळापासून लोकांनी तीर्थयात्रा, व्यापार व ज्ञानासाठी प्रवास केला. आज पर्यटन हा इतिहास जतन करण्यास मदत करणारा उद्योग आहे.",
["Tradition of travel in India: pilgrimages (tirthayatra), the Pandharpur wari, foreign travellers like Hiuen Tsang.","Types of tourism: historical, geographical, religious, medical, agro-tourism, eco-tourism.","Agro-tourism lets visitors experience village and farm life; it is promoted in Maharashtra.","Tourism creates jobs: guides, hotels, transport, handicrafts.","Tourists should respect heritage sites and not damage them."],
[],
"In 'explain' questions about tourism, link it to employment and heritage protection.",
[["Hiuen Tsang was a traveller from:",["Greece","China","Persia","Portugal"],1,"Chinese Buddhist pilgrim."],
["Visiting farms and villages for leisure is:",["Medical tourism","Agro-tourism","Space tourism","Adventure tourism"],1,"Popular in Maharashtra."],
["Travelling for treatment is called:",["Medical tourism","Eco-tourism","Religious tourism","Historical tourism"],0,"Health-related travel."],
["Tourism helps the local economy by creating:",["Pollution only","Employment","Wars","Taxes only"],1,"Guides, hotels, crafts."],
["The Pandharpur wari is an example of:",["Religious tourism","Medical tourism","Space tourism","Business tourism"],0,"Pilgrimage tradition."]]),

C("h9","Heritage Management","ऐतिहासिक ठेव्यांचे जतन",
"Heritage management means preserving historical objects, documents, monuments and traditions through museums, archives and libraries.",
"वस्तू, कागदपत्रे, स्मारके व परंपरा यांचे संग्रहालये, अभिलेखागार व ग्रंथालयांद्वारे जतन करणे म्हणजे ऐतिहासिक ठेव्यांचे जतन.",
["Museums preserve and display objects; archives preserve documents; libraries preserve books and manuscripts.","Chhatrapati Shivaji Maharaj Vastu Sangrahalaya (formerly Prince of Wales Museum), Mumbai, is a major museum.","The National Archives of India is in New Delhi.","The Asiatic Society of Mumbai has a rich library.","Careers: museology, archival studies, conservation, cataloguing.","Citizens have a duty to protect monuments and not deface them."],
[],
"Name one museum, one archive and one library from India in your answer for full marks.",
[["Documents are preserved in:",["Museums","Archives","Zoos","Parks"],1,"Archives store records."],
["The former name of Chhatrapati Shivaji Maharaj Vastu Sangrahalaya:",["Victoria Museum","Prince of Wales Museum","Indian Museum","National Museum"],1,"In Mumbai."],
["The National Archives of India is located in:",["Mumbai","New Delhi","Kolkata","Pune"],1,"New Delhi."],
["The study of museum management is called:",["Museology","Philately","Numismatics","Epigraphy"],0,"Museology."],
["Who is responsible for protecting monuments?",["Only government","Every citizen","Only historians","Only tourists"],1,"A fundamental duty of all citizens."]])
];

["The 73rd and 74th Constitutional Amendments (1992) gave constitutional status to rural and urban local self-government.","Reservation for women in local bodies; Maharashtra provides 50%.","Right to Information Act (2005) increases transparency.","Right to Education makes education a fundamental right for children aged 6–14.","Social justice: reservations and measures for equality.","The judiciary protects rights through judicial review and Public Interest Litigation (PIL)."],

C("p2","The Electoral Process","निवडणूक प्रक्रिया",
"Free and fair elections are the base of democracy. The Election Commission of India conducts elections and enforces rules such as the code of conduct.",
"मुक्त व निःपक्षपाती निवडणुका हा लोकशाहीचा पाया आहे. भारतीय निवडणूक आयोग निवडणुका घेतो व आचारसंहिता लागू करतो.",

C("p3","Political Parties","राजकीय पक्ष",
"Political parties contest elections, form governments or act as the opposition, and connect people with the government.",
"राजकीय पक्ष निवडणुका लढवतात, सरकार बनवतात किंवा विरोधी पक्ष म्हणून काम करतात आणि जनता व शासन यांना जोडतात.",
["Features: ideology, programme, leadership, members, aim of gaining power.","Functions: contesting elections, forming government, acting as opposition, shaping public opinion.","The Election Commission recognises parties as national or state parties based on votes and seats.","India has a multi-party system; coalition governments are common.","Regional parties represent regional identity and issues.","The opposition keeps a check on the government."],

C("p4","Social and Political Movements","सामाजिक व राजकीय चळवळी",
"Movements are collective efforts of people to bring change. In India there have been tribal, peasant, workers', women's, environmental and consumer movements.",
"समाजात बदल घडवण्यासाठी लोकांनी केलेले सामूहिक प्रयत्न म्हणजे चळवळ. भारतात आदिवासी, शेतकरी, कामगार, स्त्री, पर्यावरण व ग्राहक चळवळी झाल्या.",
["Tribal movements: rights over forest land and identity.","Peasant movements: fair prices, loans, land rights.","Workers' movements: wages, working conditions, job security.","Women's movement: equality, safety, political participation.","Environmental movements: Chipko (protecting trees), Narmada Bachao Andolan.","Consumer movement: Consumer Protection Act, 1986 gives consumers rights and courts."],
[],

["A main demand of peasant movements:",["Fair prices for crops","Higher film tickets","More TV channels","Foreign travel"],0,"Farmers' livelihood."],
["Movements in a democracy aim to:",["Bring social change","Stop elections","End the Constitution","Promote violence"],0,"Peaceful collective action."]]),

C("p5","Challenges faced by Indian Democracy","भारतीय लोकशाहीपुढील आव्हाने",
"Indian democracy faces challenges like terrorism, naxalism, communalism, corruption and criminalisation of politics. Active citizens help overcome them.",
"दहशतवाद, नक्षलवाद, जमातवाद, भ्रष्टाचार व राजकारणाचे गुन्हेगारीकरण ही भारतीय लोकशाहीपुढील आव्हाने आहेत. जागरूक नागरिक ती दूर करू शकतात.",
["Terrorism and naxalism threaten security and development.","Communalism divides people on the basis of religion.","Corruption reduces trust in the system.","Criminalisation of politics: people with criminal records entering politics.","Remedies: electoral reforms, Lokpal, RTI, awareness, people's participation.","Deepening democracy needs informed and active citizens."],
[],
"For each challenge write one effect and one remedy. Examiners reward balanced answers.",
[["Divisions based on religion are called:",["Communalism","Federalism","Secularism","Socialism"],0,"Threat to unity."],
["Which helps fight corruption?",["Right to Information","Censorship","Hiding records","Fewer elections"],0,"Transparency."],
["The anti-corruption body at the national level is:",["Lokpal","Lok Sabha","Election Commission","NITI Aayog"],0,"Lokpal."],
["Criminalisation of politics means:",["Criminals entering politics","Police joining politics","Courts making laws","Voting in jail"],0,"A threat to democracy."],
["Democracy becomes stronger with:",["Active citizen participation","Low voter turnout","Violence","Fake news"],0,"Informed, active citizens."]])

C("e3","Physiography and Drainage","प्राकृतिक रचना व जलप्रणाली",
"Physiography is the arrangement of landforms. India has the Himalaya, northern plains, peninsular plateau, coasts and islands. Brazil has the Amazon basin, highlands, escarpment and coastal plains.",
"भूरूपांची रचना म्हणजे प्राकृतिक रचना. भारतात हिमालय, उत्तर मैदान, द्वीपकल्पीय पठार, किनारे व बेटे; ब्राझीलमध्ये ॲमेझॉन खोरे, उच्चभूमी, कडा व किनारी मैदाने.",
["Brazil: Brazilian Highlands (plateau), Great Escarpment along the east coast, Amazon basin, coastal plains, Pantanal wetland.","The Amazon is the largest river in the world by volume of water; it flows west to east into the Atlantic.","Brazil's rivers: Amazon, Paraná, São Francisco.","India: Himalayan rivers (Ganga, Indus, Brahmaputra) are perennial.","Peninsular rivers (Godavari, Krishna, Narmada, Tapi) are mostly seasonal; Narmada and Tapi flow west.","Brazil's coast has few natural harbours due to the escarpment."],

C("e4","Climate","हवामान",
"India has a monsoon type of climate. Brazil, being mostly in the tropics, has a hot and humid climate, with variations from the Amazon to the dry north-east.",
"भारताचे हवामान मान्सून प्रकारचे आहे. ब्राझील मुख्यतः उष्ण कटिबंधात असल्याने तिथे उष्ण व दमट हवामान आहे.",

["Cyclones are more frequent on India's:",["East coast","West coast","Northern plains","Himalaya"],0,"Bay of Bengal cyclones."]]),

C("e5","Natural Vegetation and Wildlife","नैसर्गिक वनस्पती व प्राणी",
"Both countries have rich biodiversity. Brazil's Amazon rainforest is the largest tropical forest. India has evergreen, deciduous, thorny, Himalayan and mangrove forests.",

["Brazil: evergreen rainforests (Selvas), Caatinga (thorny scrub in the north-east), Campos (grasslands), Pantanal wetlands.","The Amazon rainforest is called the 'lungs of the world'.","India: tropical evergreen (Western Ghats, North-East), deciduous (most common), thorny (Rajasthan), Himalayan, mangroves (Sundarbans).","Wildlife of Brazil: jaguar, anaconda, sloth, toucan. India: tiger, elephant, one-horned rhino, lion (Gir).","Deforestation is a serious problem in both countries."],
[],

["Mangrove forests in India are found in the:",["Sundarbans","Thar","Ladakh","Malwa"],0,"Delta of Ganga–Brahmaputra."],
["Most common forest type in India:",["Tropical deciduous","Mangrove","Alpine","Coniferous"],0,"Monsoon forests."],
["Which animal is found in Brazil's forests?",["Jaguar","Snow leopard","Asiatic lion","Yak"],0,"Large wild cat of South America."]]),

C("e6","Population","लोकसंख्या",

MR.s4 = {k:["ज्यूलचा नियम: निर्माण होणारी उष्णता H = I²Rt. हीटर, इस्त्री, फ्यूजमध्ये उपयोग.","विद्युत ऊर्जेचे व्यावहारिक एकक: किलोवॅट तास (kWh) = 1 युनिट = 3.6 × 10⁶ J.","उजव्या हाताच्या अंगठ्याचा नियम: विद्युतवाहक तारेभोवतीच्या चुंबकीय क्षेत्राची दिशा.","फ्लेमिंगचा डाव्या हाताचा नियम: वाहकावरील बलाची दिशा (विद्युत चलित्र / मोटर).","फ्लेमिंगचा उजव्या हाताचा नियम: प्रवर्तित विद्युतधारेची दिशा (विद्युत जनित्र).","भारतात घरगुती पुरवठा AC, 220 V आणि 50 Hz असतो."],

MR.s5 = {k:["अप्रकट उष्मा: अवस्था बदलताना तापमान न बदलता शोषली किंवा बाहेर पडणारी उष्णता.","पुनर्हिमायन: दाबामुळे बर्फ वितळतो आणि दाब काढल्यावर पुन्हा गोठतो.","पाण्याची घनता 4 °C ला सर्वाधिक असते (असंगत आचरण); हे होपच्या उपकरणाने दाखवतात.","यामुळे तलाव वरून गोठतात आणि खालचे जलचर जिवंत राहतात.","दवबिंदू: ज्या तापमानाला हवा बाष्पाने संपृक्त होते.","विशिष्ट उष्मा धारकता: 1 kg पदार्थाचे तापमान 1 °C ने वाढवण्यासाठी लागणारी उष्णता. पाण्याची ही किंमत जास्त असते."],

MR.s6 = {k:["प्रकाश घन माध्यमात जाताना स्तंभिकेकडे (normal) वाकतो आणि विरल माध्यमात स्तंभिकेपासून दूर जातो.","स्नेलचा नियम: दिलेल्या माध्यम जोडीसाठी sin i / sin r स्थिर असतो.","निरपेक्ष अपवर्तनांक n = निर्वातातील प्रकाशाचा वेग ÷ माध्यमातील वेग.","अपस्करण: लोलकात पांढरा प्रकाश सात रंगांत (ता ना पि हि नि पा जा) विभागला जातो. तांबडा सर्वात कमी, जांभळा सर्वात जास्त वळतो.","इंद्रधनुष्य: पाण्याच्या थेंबांत अपस्करण, अपवर्तन व आंतरिक पूर्ण परावर्तन.","आंतरिक पूर्ण परावर्तन: घन → विरल माध्यमात प्रकाश क्रांतिक कोनापेक्षा मोठ्या कोनाने आपाती असेल तेव्हा घडते."],

e:["निर्वातातील वेग ÷ माध्यमातील वेग.","तांबड्या रंगाची तरंगलांबी सर्वात जास्त असते.","हवेचे बदलते थर ताऱ्यांचा प्रकाश वाकवतात.","काच प्रकाशीयदृष्ट्या घन आहे.","आणि आपाती कोन > क्रांतिक कोन."]};
MR.s7 = {k:["कार्टेशियन चिन्ह संकेत वापरा: अंतरे प्रकाशीय मध्यापासून मोजा; आपाती प्रकाशाच्या दिशेची अंतरे धन.","बहिर्गोल भिंगाचे नाभीय अंतर धन; अंतर्गोल भिंगाचे ऋण.","भिंगाची शक्ती डायॉप्टर (D) मध्ये मोजतात; 1 D = 1/m.","निकटदृष्टिता (मायोपिया): अंतर्गोल भिंगाने दूर होते.","दूरदृष्टिता (हायपरमेट्रोपिया): बहिर्गोल भिंगाने दूर होते.","वृद्धदृष्टिता: द्विनाभीय भिंग. सामान्य डोळ्याचा निकटबिंदू = 25 सेमी."],

MR.s8 = {k:["धातू चकाकणारे, वर्धनीय, तन्य व सुवाहक असतात. पारा हा द्रव धातू आहे.","अभिक्रियाशीलता श्रेणी: K > Na > Ca > Mg > Al > Zn > Fe > Pb > H > Cu > Hg > Ag > Au.","धातुक (ore) = ज्यापासून धातू फायदेशीरपणे मिळतो ते खनिज. मृदा अशुद्धी = गँग.","संहतीकरण: गुरुत्व पृथक्करण, चुंबकीय पृथक्करण, फेस तरंगण पद्धत, निक्षालन.","भाजणे: सल्फाइड धातुक हवेत तापवणे; भस्मीकरण: कार्बोनेट धातुक हवेशिवाय तापवणे.","ॲल्युमिनिअम: बायरच्या प्रक्रियेने ॲल्युमिना, हॉल-हेरॉल्ट विद्युत अपघटनाने ॲल्युमिनिअम.","क्षरण प्रतिबंध: रंग देणे, जस्तलेपन (galvanizing), कल्हई, धनाग्रीकरण, संमिश्रीकरण."],

e:["सल्फाइड धातुकाचे कण फेसाला चिकटतात.","भस्मीकरणाने CO₂ निघून जातो.","जस्त लोखंडाचे गंजण्यापासून रक्षण करते.","पारा (Hg).","पोटॅशिअम श्रेणीत सर्वात वर आहे."]};

e:["पृथ्वीच्या परिवलनाइतकाच काळ: 24 तास.","इंडियन स्पेस रिसर्च ऑर्गनायझेशन.","उच्च कक्षा, सुमारे 35780 किमी.","2013 मध्ये प्रक्षेपित.","v ∝ 1/√(R + h), म्हणून कमी होतो."]};

MR.b1 = {k:["मध्यवर्ती तत्त्व: DNA → (प्रतिलेखन) → RNA → (भाषांतरण) → प्रथिन.","RNA चे प्रकार: mRNA, tRNA, rRNA.","उत्परिवर्तन: आनुवंशिक पदार्थात अचानक होणारा बदल.","उत्क्रांतीचे पुरावे: आकारशास्त्रीय, शरीरशास्त्रीय (समजात व समरूप इंद्रिये), अवशेषांगे, जीवाश्म, भ्रूणशास्त्र, जोडणारे दुवे.","मानवातील अवशेषांगे: आंत्रपुच्छ (appendix), अक्कलदाढ, शेपटीचे हाड, कानाचे स्नायू.","जोडणारे दुवे: पेरिपॅटस (वलयी–संधिपाद), बदकचोच प्लॅटिपस (सरीसृप–सस्तन), फुफ्फुसमासा (मासे–उभयचर).","सिद्धांत: लॅमार्क (वापर-न वापर), डार्विन (नैसर्गिक निवड). कार्बन-14 पद्धतीने जीवाश्मांचे वय कळते."],
tip:"उत्क्रांतीच्या प्रत्येक पुराव्याची उदाहरणे शिका. DNA → RNA → प्रथिन यांची स्वच्छ आकृती काढा.",
e:["DNA चा संकेत mRNA मध्ये उतरवणे म्हणजे प्रतिलेखन.","मानवात त्याचे स्पष्ट कार्य नाही.","त्यात दोन्ही संघांची लक्षणे दिसतात.","चार्ल्स डार्विन.","C-14 च्या ऱ्हासावर आधारित पद्धत."]};
MR.b2 = {k:["कर्बोदके, मेद व प्रथिने हे ऊर्जेचे स्रोत आहेत.","ग्लायकोलिसिस पेशीद्रव्यात होते; एका ग्लुकोजपासून पायरुविक आम्लाचे दोन रेणू मिळतात.","क्रेब्ज चक्र (TCA चक्र) तंतुकणिकेत (mitochondria) होते.","एका ग्लुकोजच्या ऑक्सिश्वसनात 38 ATP मिळतात; विनॉक्सिश्वसनात खूप कमी.","सूत्री विभाजन: एका पेशीपासून दोन सारख्या पेशी. टप्पे: पूर्वावस्था, मध्यावस्था, पश्चावस्था, अंत्यावस्था, नंतर पेशीद्रव्य विभाजन.","अर्धगुणसूत्री विभाजन: एका पेशीपासून अर्ध्या गुणसूत्रांच्या चार पेशी; युग्मके तयार होतात. जनुकीय विचरण बदल घडवते."],
tip:"सूत्री व अर्धगुणसूत्री विभाजनातील फरकांची सारणी तयार करा — हा प्रश्न वारंवार येतो.",
e:["श्वसनाची पहिली पायरी पेशीद्रव्यात होते.","पाठ्यपुस्तकानुसार 38 ATP.","गुणसूत्रांची संख्या अर्धी होते.","पेशीचे ऊर्जा केंद्र: तंतुकणिका.","दोन विभाजनांनंतर चार पेशी."]};
MR.b3 = {k:["अलैंगिक पद्धती: द्विविभाजन (अमिबा), बहुविभाजन, मुकुलायन (हायड्रा, यीस्ट), खंडीभवन (स्पायरोगायरा), बीजाणू निर्मिती, शाकीय प्रजनन.","फूल: निदलपुंज, दलपुंज, पुमंग (नर), जायांग (मादी).","परागण: स्वपरागण व परपरागण. दुहेरी फलन हे सपुष्प वनस्पतींचे वैशिष्ट्य आहे.","मानवी पुरुष: वृषणात शुक्राणू; स्त्री: अंडाशयात अंडपेशी; फलन अंडवाहिनीत होते.","मासिक पाळीचे चक्र साधारण 28 दिवसांचे असते.","एकसारखी जुळी एका युग्मनजापासून; भिन्न जुळी दोन अंड्यांपासून होतात.","प्रजनन आरोग्य: स्वच्छता, लैंगिक रोगांपासून बचाव आणि IVF सारखी तंत्रे."],
