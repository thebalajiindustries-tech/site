let Q = null;
function makeQuiz(items, source, ems){
  return {source, i:0, score:0, picked:null, wrong:[], items: shuffle(items.map((x, i) => x.concat([(ems || [])[i] || ""]))).map(([q, o, a, e, em]) => {
    const order = shuffle([0,1,2,3]); return {q, o: order.map(k => o[k]), a: order.indexOf(a), e, em};
  })};
}
const expl = it => it.em ? `${esc(it.em)}<div class="small muted" style="margin-top:4px">${esc(it.e)}</div>` : esc(it.e);
function renderQuiz(el, s, c){
  if (!Q || Q.chId !== c.id){ Q = makeQuiz(c.q, "book", mrOf(c).e); Q.chId = c.id; }
  const qz = Q;
  if (qz.i >= qz.items.length){
    const pct = Math.round(qz.score / qz.items.length * 100);
    if (qz.source === "book"){ store.quiz[c.id] = Math.max(store.quiz[c.id] ?? 0, pct); save(); }
    el.innerHTML = `
    <div class="quiz sheet pad" style="display:grid;gap:12px">
      <div class="eyebrow">${qz.source === "ai" ? "Fresh questions from Claude" : "Chapter quiz"} · result</div>

        <span>${pct >= 80 ? '<span class="chip ok">Mastered</span> Great work! Move on to the next chapter.' : pct >= 50 ? '<span class="chip warn">Almost there</span> Read the notes once more and retry.' : '<span class="chip bad">Needs revision</span> Watch the lesson again, then retry.'}</span></div>
      ${qz.wrong.length ? `<div class="eyebrow">Review your mistakes</div>${qz.wrong.map(w => `<div class="explain"><b>${esc(w.q)}</b><br>बरोबर उत्तर: <b>${esc(w.o[w.a])}</b><div class="small" style="margin-top:4px">${expl(w)}</div></div>`).join("")}` : ""}
      <div class="row">
        <button class="btn primary" id="retry">Retry this quiz</button>
        ${AI ? `<button class="btn" id="aiMore">Get 5 fresh questions from Claude</button>` : ""}
      </div>
      <div id="aiMsg" class="small muted"></div>
    </div>`;
    $("#retry").onclick = () => { Q = makeQuiz(c.q, "book", mrOf(c).e); Q.chId = c.id; renderQuiz(el, s, c); };
    if ($("#aiMore")) $("#aiMore").onclick = () => aiQuiz(el, s, c);
    return;
  }
  const it = qz.items[qz.i];
  el.innerHTML = `
  <div class="quiz sheet pad">
    <div class="qhead"><span class="eyebrow">${qz.source === "ai" ? "Fresh question from Claude" : "Question"} ${qz.i+1} of ${qz.items.length}</span><span class="chip">Score ${qz.score}</span></div>
    <div class="bar" style="margin-top:8px"><i style="width:${qz.i/qz.items.length*100}%"></i></div>
    <div class="qtext">${esc(it.q)}</div>
    <div class="opts">${it.o.map((o, k) => `<button class="opt" data-k="${k}"><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="exp"></div>
    ${qz.i === 0 && qz.source === "book" && AI ? `<p class="small muted" style="margin:12px 0 0">Finished these? Claude can make fresh questions after the quiz.</p>` : ""}
  </div>`;
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = +b.dataset.k; const ok = k === it.a;
    if (ok) qz.score++; else qz.wrong.push(it);
    el.querySelectorAll(".opt").forEach(x => { x.disabled = true; const kk = +x.dataset.k; if (kk === it.a) x.classList.add("right"); else if (kk === k) x.classList.add("wrong"); });

  });
}
async function aiQuiz(el, s, c){
  const btn = $("#aiMore"), msg = $("#aiMsg"); btn.disabled = true; msg.textContent = "Claude is writing new questions… (10–40 seconds)";
  try {
    const data = await AI.json(`You are an experienced Maharashtra State Board SSC (Std 10) paper setter. Write 5 NEW multiple-choice questions for the chapter "${c.t}" from ${s.name} (Balbharati textbook). Mix easy, medium and one tricky application question, in the style of SSC board papers. Do not repeat these existing questions: ${c.q.map(x => x[0]).join(" | ")}.
Chapter key points: ${c.k.join(" ")}
${c.f.length ? "Formulas: " + c.f.join("; ") : ""}
Every question must have exactly 4 options and exactly one correct option. Double-check each answer.
Write the question and options in English (as in the semi-English board paper). Write the explanation "em" in simple Marathi (technical terms may stay in English).
Reply with only a JSON array like: [{"q":"question text","o":["A","B","C","D"],"a":0,"em":"एका ओळीत मराठी स्पष्टीकरण"}]`);
    const items = (Array.isArray(data) ? data : []).filter(x => x && x.q && Array.isArray(x.o) && x.o.length === 4 && Number.isInteger(x.a) && x.a >= 0 && x.a < 4).map(x => [String(x.q), x.o.map(String), x.a, ""]);
    const ems = data.filter(x => x && x.q && Array.isArray(x.o) && x.o.length === 4 && Number.isInteger(x.a) && x.a >= 0 && x.a < 4).map(x => String(x.em || x.e || ""));
    if (!items.length) throw {code:"invalid_json"};
    Q = makeQuiz(items, "ai", ems); Q.chId = c.id; renderQuiz(el, s, c);
  } catch(e) { msg.textContent = aiErr(e); btn.disabled = false; }
}

  t.innerHTML = CK.files.map((x, i) => `<div class="thumb"><img src="${x.url}" alt="Page ${i+1}"><button data-rm="${i}" aria-label="Remove page ${i+1}">✕</button></div>`).join("");
  t.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { const x = CK.files.splice(+b.dataset.rm, 1)[0]; URL.revokeObjectURL(x.url); renderCheck(); });

async function runCheck(){
  if (!AI || !CK.files.length) return;
  const s = SUBJECTS.find(x => x.id === CK.subj); const ch = CK.chap ? findCh(CK.chap).c : null;
  CK.busy = true; CK.result = null; CK.ctl = new AbortController(); renderCheck();
  $("#ckResult").innerHTML = `<div class="sheet pad"><b>Claude तुमची ${CK.files.length} पाने वाचत आहे…</b><p class="small muted" style="margin:4px 0 0">काळजीपूर्वक तपासणीला 30–90 सेकंद लागतात. हे पान उघडे ठेवा.</p></div>`;
  const prompt = `You are an experienced Maharashtra State Board SSC (Std 10) examiner and a kind, encouraging tutor.
Subject: ${s.name}. ${ch ? `Chapter: ${ch.t}.` : "Scope: whole paper or mixed chapters."}
${CK.total ? `Total marks for this attempt: ${CK.total}.` : "Total marks were not given; use the marks printed on the sheet, or typical SSC marks for each question type."}
${CK.qtext.trim() ? `Questions given by the student:\n${CK.qtext.trim()}` : "The questions may be written on the sheet; if not, infer each question from the answer."}
The attached ${CK.files.length} image(s) are photos of the student's handwritten answer sheet, in page order. Answers may be in English or Marathi.
Do this:
1. Read every answer carefully.
2. Mark each answer the way an SSC board examiner would: step marks for maths and numericals, key terms/diagrams/examples for science and social science, format + content + language for English writing.
3. Be accurate and fair. Never give marks for something not written.
4. For each question give a short, correct model answer (with steps for maths).
Write "summary", "feedback", "strengths", "improve", "revise" in simple Marathi (keep technical terms in English). Write "question" and "model_answer" in the same language as the student's paper.
Reply with only JSON in this shape:
{"readable":true,"summary":"2-3 sentences on overall performance","marks_awarded":0,"marks_total":0,"questions":[{"label":"Q1 (i)","question":"question text","student_answer":"one line on what the student wrote","verdict":"correct|partial|wrong|not_attempted","awarded":0,"max":0,"feedback":"what was right and what was missing","model_answer":"the correct answer"}],"strengths":["..."],"improve":["specific, actionable points"],"marathi_tip":"one short encouraging tip in Marathi","revise":["topics to revise"]}
If the photos are unreadable or are not an answer sheet, set "readable": false, explain in "summary" what the student should do (better light, full page), and leave "questions" empty.`;
  try {
    const r = await AI.json(prompt, {images: CK.files.map(x => x.f), modelTier: "complex", signal: CK.ctl.signal});
    CK.result = r;
    if (r && r.readable !== false && typeof r.marks_awarded === "number"){
      store.checks.push({date: new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short"}), subject: s.short + (ch ? " · " + ch.t : ""), got: r.marks_awarded, total: r.marks_total}); store.checks = store.checks.slice(-30); save();
    }
  } catch(e) { CK.result = {error: aiErr(e)}; }
  CK.busy = false; CK.ctl = null;
  if (S.view === "check" || (S.view === "chapter" && S.ctab === "check")) renderCheck();
}

  const vchip = v => ({correct:'<span class="chip ok">बरोबर</span>', partial:'<span class="chip warn">अंशतः बरोबर</span>', wrong:'<span class="chip bad">चूक</span>', not_attempted:'<span class="chip">सोडवला नाही</span>'}[v] || "");
  const qs = Array.isArray(r.questions) ? r.questions : [];
  box.innerHTML = `
  <div class="sheet pad" style="display:grid;gap:14px">
    <div class="result-head">
      <div class="marks">${esc(r.marks_awarded)}<small> / ${esc(r.marks_total)}</small></div>
      ${+r.marks_total > 0 ? (() => { const pct = Math.round(r.marks_awarded / r.marks_total * 100), g = gradeOf(pct); return `<div class="gradebox ${g.cls}"><div class="pct">${pct}%</div><div><b>${g.g}</b><br><span class="small">${g.e}</span></div></div>`; })() : ""}
      <div style="flex:1;min-width:220px"><div class="eyebrow">परीक्षकाचा अभिप्राय</div><p style="margin:4px 0 0">${esc(r.summary)}</p></div>
    </div>
    ${r.marathi_tip ? `<div class="note mr">${esc(r.marathi_tip)}</div>` : ""}
    <div class="grid" style="gap:10px">${qs.map(q => `
      <div class="qres">
        <div class="h"><b>${esc(q.label)} ${vchip(q.verdict)}</b><span class="redpen">${esc(q.awarded)} / ${esc(q.max)}</span></div>
        ${q.question ? `<div class="small"><b>प्रश्न:</b> ${esc(q.question)}</div>` : ""}
        ${q.student_answer ? `<div class="small muted"><b>तुम्ही लिहिले:</b> ${esc(q.student_answer)}</div>` : ""}
        <div class="small"><b>अभिप्राय:</b> ${esc(q.feedback)}</div>
        ${q.model_answer ? `<details class="small"><summary style="cursor:pointer;color:var(--blue);font-weight:600">आदर्श उत्तर पहा</summary><div style="margin-top:6px;white-space:pre-wrap">${esc(q.model_answer)}</div></details>` : ""}
      </div>`).join("")}</div>
    <div class="cols">
      ${Array.isArray(r.strengths) && r.strengths.length ? `<div><div class="eyebrow">काय चांगले केले</div><ul class="kp">${r.strengths.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      ${Array.isArray(r.improve) && r.improve.length ? `<div><div class="eyebrow">जास्त गुण कसे मिळवाल</div><ul class="kp">${r.improve.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    </div>
    ${Array.isArray(r.revise) && r.revise.length ? `<div class="small"><b>पुढे उजळणी करा:</b> ${r.revise.map(esc).join(", ")}</div>` : ""}
    <div class="row"><button class="btn" id="ckNew">दुसरी उत्तरपत्रिका तपासा</button></div>
  </div>`;
  $("#ckNew").onclick = () => { CK.files.forEach(x => URL.revokeObjectURL(x.url)); CK.files = []; CK.result = null; renderCheck(); };
}

// ---------- doubt tutor ----------
const CHAT = {turns:[], busy:false, ctl:null, file:null};
function renderAsk(){
  app().innerHTML = `
  <div class="chhead" style="margin-top:18px">
    <span class="eyebrow">Doubt solver</span>
    <h1>Ask Claude any doubt</h1>
    <p class="muted" style="margin:0">Type a question from any subject, or attach a photo of a textbook problem. You get a step-by-step answer in English with a मराठी explanation.</p>
  </div>
  <div class="panel" id="panel"></div>`;
  renderChat($("#panel"), null);
}
function renderChat(el, ctx){
  const key = ctx ? ctx.c.id : "all";
  if (CHAT.key !== key && !CHAT.busy){ CHAT.key = key; CHAT.turns = []; CHAT.file = null; }
  if (aiChecked && !AI){ el.innerHTML = `<div class="note">इथे AI उपलब्ध नाही, त्यामुळे शंका विचारता येणार नाही. धडे, नोट्स व सराव प्रश्न वापरता येतील.</div>`; return; }
  if (window.SSC_WEB && !window.claude && !store.code){ el.innerHTML = codeCard(); bindCode(() => renderChat(el, ctx)); return; }
  const sugg = ctx ? [`Explain "${ctx.c.k[0]}" with an example`, `Give me 3 important board questions on ${ctx.c.t}`, `What mistakes do students make in ${ctx.c.t}?`]
    : ["How do I find the discriminant and nature of roots?", "Explain Fleming's left hand rule simply", "Difference between mitosis and meiosis", "How to write a formal letter to the editor?"];
  el.innerHTML = `
  <div class="chat">
    <div class="msgs" id="msgs">${CHAT.turns.length ? "" : `<div class="msg ai"><p>Namaskar! I am your SSC study partner. Ask me a doubt ${ctx ? `about <b>${esc(ctx.c.t)}</b>` : "from any subject"}. मी मराठीतही समजावून सांगेन.</p></div>`}</div>
    <div class="sugg">${sugg.map(x => `<button data-sugg="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <div class="compose">
      <textarea id="chatIn" rows="2" placeholder="Type your doubt… (Enter to send, Shift+Enter for a new line)"></textarea>
      ${AI_IMG ? `<label class="btn" for="chatImg" title="Attach a photo of the question" style="cursor:pointer">Photo</label><input id="chatImg" type="file" accept="${esc(AI_IMG.mediaTypes.join(","))}" class="hidden">` : ""}
      <button class="btn primary" id="chatGo">Ask</button>
    </div>
    <div class="small muted" id="chatFile"></div>
  </div>`;
  drawMsgs();
  const send = () => askChat(ctx);
  $("#chatGo").onclick = send;
  $("#chatIn").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } };
  el.querySelectorAll("[data-sugg]").forEach(b => b.onclick = () => { $("#chatIn").value = b.dataset.sugg; send(); });
  if ($("#chatImg")) $("#chatImg").onchange = e => { CHAT.file = e.target.files[0] || null; $("#chatFile").textContent = CHAT.file ? "Photo attached: " + CHAT.file.name : ""; };
}
function drawMsgs(live){
  const m = $("#msgs"); if (!m) return;
  const intro = CHAT.turns.length ? "" : m.innerHTML;
  m.innerHTML = (CHAT.turns.length ? "" : intro) + CHAT.turns.map(t => t.role === "user" ? `<div class="msg me">${esc(t.show || t.content)}</div>` : `<div class="msg ai">${md(t.content)}</div>`).join("") + (live != null ? `<div class="msg ai">${live ? md(live) : "<p>Thinking…</p>"}</div>` : "");
  m.lastElementChild && m.lastElementChild.scrollIntoView({block:"nearest"});
}
async function askChat(ctx){
  const box = $("#chatIn"); const q = box.value.trim();
  if (!q || CHAT.busy || !AI) return;
  box.value = "";
  const img = CHAT.file; CHAT.file = null; if ($("#chatFile")) $("#chatFile").textContent = "";
  CHAT.turns.push({role:"user", content: q + (img ? "\n[The student attached a photo of a question.]" : ""), show: q + (img ? " (photo attached)" : "")});
  CHAT.busy = true; $("#chatGo").disabled = true; drawMsgs("");
  const rules = `You are "SSC Saathi", a patient tutor for a Maharashtra State Board Std 10 (SSC) student who uses Balbharati textbooks.
${ctx ? `The student is studying ${ctx.s.name}, chapter "${ctx.c.t}". Key points: ${ctx.c.k.join(" ")}` : ""}
How to answer:
- Explain in simple Marathi. Keep technical terms, formulas and English words from the textbook in English (in brackets where helpful), because the student studies in semi-English.
- Start with a 1–2 line direct answer.
- Then explain step by step with one small everyday example. For maths, show every step like a board-exam answer.
- Add a "परीक्षा टीप" (exam tip) when useful: marks, keywords examiners look for.
- If the student writes in English and asks for English, answer in English instead.
- Keep it under 250 words unless the student asks for more. Use only simple markdown: **bold** and "- " bullets. No tables, no LaTeX.
- If a photo is attached, first read the question from it.
- If the question is not about studies, gently bring the student back to exam preparation.
Reply "Understood" to confirm.`;
  const turns = [{role:"user", content: rules}, {role:"assistant", content:"Understood"}, ...CHAT.turns.slice(-10).map(t => ({role:t.role, content:t.content}))];
  CHAT.ctl = new AbortController();
  try {
    const {text} = await AI(turns, {cache:false, signal: CHAT.ctl.signal, images: img ? [img] : undefined, onText: ({text}) => drawMsgs(text)});
    CHAT.turns.push({role:"assistant", content:text});
  } catch(e) {
    CHAT.turns.push({role:"assistant", content: (e && e.text ? e.text + "\n\n" : "") + aiErr(e)});
  }
  CHAT.busy = false; drawMsgs(); if ($("#chatGo")) $("#chatGo").disabled = false;
}

// ---------- study plan ----------
function buildPlan(days){
  const todo = [];
  // interleave subjects so each day mixes them
  const queues = SUBJECTS.map(s => s.ch.filter(c => (store.quiz[c.id] ?? -1) < 80).map(c => ({s, c})));
  let any = true; while (any){ any = false; for (const q of queues){ if (q.length){ todo.push(q.shift()); any = true; } } }
  const dl = daysLeft();
  const studyDays = dl != null && dl > 0 ? Math.max(1, dl - 21) : 30; // keep the last 3 weeks for full revision & papers
  const perDay = Math.max(2, Math.ceil(todo.length / studyDays));
  const out = []; const start = new Date();
  for (let d = 0; d < days; d++){
    const date = new Date(start); date.setDate(start.getDate() + d);
    out.push({date, items: todo.slice(d * perDay, d * perDay + perDay)});
  }
  return out;
}
function renderPlan(){
  const dl = daysLeft();
  const plan = buildPlan(14);
  const weak = []; SUBJECTS.forEach(s => s.ch.forEach(c => { const b = store.quiz[c.id]; if (b != null && b < 80) weak.push({s, c, b}); }));
  weak.sort((a, b) => a.b - b.b);
  app().innerHTML = `
  <div class="chhead" style="margin-top:18px">
    <span class="eyebrow">My progress & plan</span>
    <h1>Study plan</h1>
    <p class="muted" style="margin:0">${dl != null ? `${Math.max(dl,0)} days to your first paper. The plan finishes new chapters early and keeps the last 3 weeks for full revision and practice papers.` : `Set your exam date on the Home page for a plan that fits your time. Until then this plan covers 2+ chapters a day.`}</p>
  </div>
  ${progressCharts()}
  <div class="cols" style="margin-top:14px">
    <div>
      <div class="eyebrow" style="margin-bottom:8px">Next 14 days</div>
      <div class="plan">${plan.map((d, i) => `
        <div class="day"><span class="d">${i === 0 ? "Today" : d.date.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}</span>
          <span class="row" style="gap:6px">${d.items.length ? d.items.map(x => `<button class="btn" style="padding:3px 10px;font-size:14px;${hueVar(x.s)};border-left:4px solid var(--hue)" data-open="${x.c.id}">${esc(x.s.short)}: ${esc(x.c.t)}</button>`).join("") : '<span class="muted small">Revision day: solve a full practice paper and check it with the answer sheet checker.</span>'}</span></div>`).join("")}</div>
    </div>
    <div style="display:grid;gap:14px;align-content:start">
      <div class="sheet pad" style="display:grid;gap:8px">
        <div class="eyebrow">Revise these first</div>
        ${weak.length ? weak.slice(0, 8).map(w => `<button class="btn" style="justify-content:space-between" data-open="${w.c.id}"><span>${esc(w.s.short)}: ${esc(w.c.t)}</span><span class="chip ${w.b < 50 ? "bad" : "warn"}">${w.b}%</span></button>`).join("") : '<span class="small muted">Take chapter quizzes; chapters scoring below 80% will appear here.</span>'}
      </div>
      <div class="sheet pad small" style="display:grid;gap:6px">
        <div class="eyebrow">Board exam strategy</div>
        <div>Read the whole paper in the first 10 minutes. Start with the questions you are surest of.</div>
        <div>Write question numbers exactly as in the paper. Underline key words.</div>
        <div>Maths: show every step and write the final answer clearly. Draw figures with a pencil.</div>
        <div>Science: draw labelled diagrams wherever they help, even when not asked.</div>
        <div>Keep 10 minutes at the end to check your answers.</div>
      </div>
    </div>
  </div>`;
}

// ---------- progress charts ----------
function progressCharts(){
  // 1) average best quiz score per subject (single hue, direct labels)
  const rows = SUBJECTS.map(s => { const sc = s.ch.map(c => store.quiz[c.id]).filter(v => v != null); return {s, n: sc.length, avg: sc.length ? Math.round(sc.reduce((a, b) => a + b, 0) / sc.length) : null}; });
  const any = rows.some(r => r.n);
  const bh = 20, gap = 10, lw = 96, cw = 420, top = 26, h = top + rows.length * (bh + gap) + 24, sx = v => lw + v / 100 * (cw - lw - 60);
  let svg = `<svg class="chart" viewBox="0 0 ${cw} ${h}" role="img" aria-label="विषयनिहाय सरासरी गुण">`;
  [0, 50, 80, 100].forEach(v => svg += `<line x1="${sx(v)}" y1="${top - 8}" x2="${sx(v)}" y2="${h - 22}" class="grid${v === 80 ? " goal" : ""}"/><text x="${sx(v)}" y="${h - 6}" class="axt" text-anchor="middle">${v}%</text>`);
  svg += `<text x="${sx(80)}" y="${top - 12}" class="axt goalt" text-anchor="middle">पक्के 80%</text>`;
  rows.forEach((r, i) => { const y = top + i * (bh + gap);
    svg += `<text x="${lw - 10}" y="${y + bh / 2}" class="lab" text-anchor="end" dominant-baseline="middle">${esc(r.s.short)}</text>`;
    if (r.avg != null){ const w = Math.max(4, sx(r.avg) - lw); svg += `<g data-tip="${esc(r.s.name)}: सरासरी ${r.avg}% (${r.n}/${r.s.ch.length} प्रकरणे सोडवली)" tabindex="0"><rect x="${lw}" y="${y - 4}" width="${cw - lw}" height="${bh + 8}" fill="transparent"/><rect x="${lw}" y="${y}" width="${w}" height="${bh}" rx="4" class="cbar"/></g><text x="${lw + w + 8}" y="${y + bh / 2}" class="val" dominant-baseline="middle">${r.avg}%</text>`; }
    else svg += `<text x="${lw + 6}" y="${y + bh / 2}" class="axt" dominant-baseline="middle">अजून सराव प्रश्न सोडवले नाहीत</text>`; });
  svg += `</svg>`;

  // 2) chapter status grid
  const stat = c => { const b = store.quiz[c.id]; if (b != null && b >= 80) return ["ok", "✓", "पक्के"]; if (b != null && b >= 50) return ["warn", "!", "उजळणी"]; if (b != null) return ["bad", "✕", "कच्चे"]; if (store.watched[c.id] || store.read[c.id]) return ["seen", "•", "पाहिले"]; return ["none", "", "सुरू नाही"]; };
  const grid = `<div class="hm">${SUBJECTS.map(s => `<div class="hm-row"><span class="hm-l">${esc(s.short)}</span><div class="hm-cells">${s.ch.map((c, i) => { const [k, sym, lab] = stat(c); const b = store.quiz[c.id]; return `<button class="hm-c ${k}" data-open="${c.id}" data-tip="${esc(s.short)} ${i + 1}. ${esc(c.m)} — ${lab}${b != null ? " " + b + "%" : ""}" aria-label="${esc(c.t)}: ${lab}">${sym || i + 1}</button>`; }).join("")}</div></div>`).join("")}</div>
    <div class="legend">${[["ok","✓","पक्के (80%+)"],["warn","!","उजळणी (50–79%)"],["bad","✕","कच्चे (<50%)"],["seen","•","धडा पाहिला"],["none","1","सुरू नाही"]].map(([k, sym, l]) => `<span><i class="hm-c ${k}">${sym}</i>${l}</span>`).join("")}</div>`;

  // 3) answer-sheet trend
  const ck = store.checks.filter(x => +x.total > 0).map(x => ({...x, pct: Math.round(+x.got / +x.total * 100)}));
  let trend;
  if (ck.length < 2) trend = `<p class="small muted" style="margin:6px 0 0">${ck.length ? `एक उत्तरपत्रिका तपासली: ${ck[0].pct}%. आणखी एक तपासली की इथे प्रगतीचा आलेख दिसेल.` : "उत्तरपत्रिका तपासल्यावर इथे गुणांचा आलेख दिसेल."}</p>`;
  else {
    const W = 420, H = 230, l = 40, r = 16, t = 20, b = 30, X = i => l + i * (W - l - r) / (ck.length - 1), Y = v => t + (100 - v) / 100 * (H - t - b);
    trend = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="उत्तरपत्रिकेतील गुण">` + [0, 50, 100].map(v => `<line x1="${l}" y1="${Y(v)}" x2="${W - r}" y2="${Y(v)}" class="grid"/><text x="${l - 6}" y="${Y(v)}" class="axt" text-anchor="end" dominant-baseline="middle">${v}%</text>`).join("")
      + `<path d="M${l},${Y(0)} ${ck.map((x, i) => `L${X(i)},${Y(x.pct)}`).join(" ")} L${X(ck.length - 1)},${Y(0)} Z" class="carea"/><path d="${ck.map((x, i) => `${i ? "L" : "M"}${X(i)},${Y(x.pct)}`).join(" ")}" class="cline"/>`
      + ck.map((x, i) => `<g data-tip="${esc(x.date)} · ${esc(x.subject)}: ${esc(x.got)}/${esc(x.total)} (${x.pct}%)" tabindex="0"><circle cx="${X(i)}" cy="${Y(x.pct)}" r="14" fill="transparent"/><circle cx="${X(i)}" cy="${Y(x.pct)}" r="${i === ck.length - 1 ? 6 : 4.5}" class="cdot"/></g>`).join("")
      + `<text x="${X(ck.length - 1)}" y="${Y(ck[ck.length - 1].pct) - 14}" class="val" text-anchor="end">${ck[ck.length - 1].pct}%</text>`
      + ck.map((x, i) => (i === 0 || i === ck.length - 1) ? `<text x="${X(i)}" y="${H - 8}" class="axt" text-anchor="${i ? "end" : "start"}">${esc(x.date)}</text>` : "").join("") + `</svg>`;
  }
  return `
  <div class="charts">
    <div class="sheet pad"><div class="eyebrow">विषयनिहाय सरासरी गुण (सराव प्रश्न)</div>${any ? "" : `<p class="small muted" style="margin:4px 0 0">सराव प्रश्न सोडवल्यावर पट्ट्या भरतील.</p>`}${svg}
      <details class="small"><summary>सारणी पहा</summary><table class="tbl"><tr><th>विषय</th><th>सोडवलेली प्रकरणे</th><th>सरासरी</th></tr>${rows.map(r => `<tr><td>${esc(r.s.name)}</td><td>${r.n}/${r.s.ch.length}</td><td>${r.avg != null ? r.avg + "%" : "—"}</td></tr>`).join("")}</table></details></div>
    <div class="sheet pad"><div class="eyebrow">उत्तरपत्रिका गुण (टक्के)</div>${trend}</div>
    <div class="sheet pad hm-card"><div class="eyebrow">प्रकरणनिहाय स्थिती</div>${grid}</div>
  </div>`;
}
// tooltip for charts
const tipEl = document.createElement("div"); tipEl.className = "ctip"; tipEl.hidden = true; document.body.appendChild(tipEl);
function showTip(t, x, y){ tipEl.textContent = t; tipEl.hidden = false; const w = tipEl.offsetWidth; tipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + "px"; tipEl.style.top = Math.max(8, y - tipEl.offsetHeight - 12) + "px"; }
document.addEventListener("pointerover", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("pointermove", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); else tipEl.hidden = true; });
document.addEventListener("focusin", e => { const t = e.target.closest("[data-tip]"); if (t){ const r = t.getBoundingClientRect(); showTip(t.dataset.tip, r.left + r.width / 2, r.top); } });
document.addEventListener("focusout", () => tipEl.hidden = true);

// ---------- global click routing ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-subj],[data-open],[data-ctab]"); if (!t) return;
  if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.subj) go("subject", {subj: t.dataset.subj});
  else if (t.dataset.open) { Q = null; go("chapter", {chap: t.dataset.open, ctab: "video"}); }
  else if (t.dataset.ctab) { stopPlayer(); S.ctab = t.dataset.ctab; renderChapter(); }
});
try { if ("speechSynthesis" in window) speechSynthesis.getVoices(); } catch(e) {}
render();
</script></body></html>
