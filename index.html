// ---------- concept diagrams (inline SVG, colours come from CSS tokens) ----------
const DG = {};
let _mk = 0;
function SV(inner, h = 360){
  const id = "ah" + (++_mk);
  return `<svg class="dg" viewBox="0 0 640 ${h}" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahd"/></marker></defs>${inner.replace(/MARK/g, id)}</svg>`;
}
function wrap(s, n){ const w = String(s).split(" "); const out = []; let cur = ""; for (const x of w){ if ((cur + " " + x).trim().length > n && cur){ out.push(cur); cur = x; } else cur = (cur + " " + x).trim(); } if (cur) out.push(cur); return out; }
function T(x, y, s, o = {}){
  const lines = o.w ? wrap(s, o.w) : [String(s)];
  const size = o.s || 16, lh = size * 1.25;
  const y0 = o.mid ? y - (lines.length - 1) * lh / 2 : y;
  return `<text x="${x}" y="${y0}" font-size="${size}" text-anchor="${o.a || "middle"}" class="${o.c || "tx"}" ${o.b ? 'font-weight="700"' : ""} dominant-baseline="middle">${lines.map((l, i) => `<tspan x="${x}" dy="${i ? lh : 0}">${esc(l)}</tspan>`).join("")}</text>`;
}
const L = (x1, y1, x2, y2, c = "ln") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
const AR = (x1, y1, x2, y2, c = "ln") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}" marker-end="url(#MARK)"/>`;
const R = (x, y, w, h, c = "bx", rx = 10) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${c}"/>`;
const CI = (cx, cy, r, c = "bx") => `<circle cx="${cx}" cy="${cy}" r="${r}" class="${c}"/>`;
const PA = (d, c = "acc") => `<path d="${d}" class="${c}"/>`;
const BOX = (x, y, w, h, s, c = "bx", o = {}) => R(x, y, w, h, c) + T(x + w / 2, y + h / 2, s, Object.assign({w: Math.max(6, Math.floor(w / (o.s || 15) * 1.7)), mid: true, s: o.s || 15}, o));

function flow(items, o = {}){
  const n = items.length; const perRow = n > 4 ? Math.ceil(n / 2) : n; const rows = Math.ceil(n / perRow);
  const gap = 34, bw = Math.min(150, (600 - (perRow - 1) * gap) / perRow), bh = o.bh || 78;
  const totalW = perRow * bw + (perRow - 1) * gap, x0 = (640 - totalW) / 2;
  const top = rows === 1 ? 180 - bh / 2 : 70;
  let s = "";
  items.forEach((it, i) => {
    const r = Math.floor(i / perRow); let col = i % perRow; if (r === 1) col = perRow - 1 - col; // snake
    const x = x0 + col * (bw + gap), y = top + r * (bh + 70);
    s += BOX(x, y, bw, bh, it, i === n - 1 || i === 0 ? "bxa" : "bx", {s: o.s || 14});
    if (i < n - 1){
      const r2 = Math.floor((i + 1) / perRow);
      if (r2 === r) s += r === 0 ? AR(x + bw + 3, y + bh / 2, x + bw + gap - 3, y + bh / 2) : AR(x - 3, y + bh / 2, x - gap + 3, y + bh / 2);
      else s += AR(x + bw / 2, y + bh + 3, x + bw / 2, y + bh + 67);
    }
  });
  if (o.note) s += T(320, 340, o.note, {c: "mu", s: 14});
  return SV(s);
}
function hub(center, items){
  const cx = 320, cy = 180, rx = 220, ry = 125; let s = "";
  items.forEach((it, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / items.length; const x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
    s += L(cx, cy, x, y, "ln");
  });
  items.forEach((it, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / items.length; const x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
    s += BOX(x - 72, y - 26, 144, 52, it, "bx", {s: 13});
  });
  s += `<ellipse cx="${cx}" cy="${cy}" rx="88" ry="40" class="bxa"/>` + T(cx, cy, center, {w: 14, mid: true, s: 16, b: 1});
  return SV(s);
}
function cycle(items){
  const cx = 320, cy = 180, r = 120, n = items.length; let s = CI(cx, cy, r, "ring");
  items.forEach((it, i) => {
    const a1 = -Math.PI / 2 + (i + 0.32) * 2 * Math.PI / n, a2 = -Math.PI / 2 + (i + 0.68) * 2 * Math.PI / n;
    s += `<path d="M${cx + r * Math.cos(a1)},${cy + r * Math.sin(a1)} A${r},${r} 0 0 1 ${cx + r * Math.cos(a2)},${cy + r * Math.sin(a2)}" class="acc" marker-end="url(#MARK)"/>`;
  });
  items.forEach((it, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; const x = cx + r * Math.cos(a) * 1.25, y = cy + r * Math.sin(a) * 1.1; s += BOX(x - 75, y - 24, 150, 48, it, "bx", {s: 14}); });
  return SV(s);
}
function tree(root, kids, o = {}){
  // kids: [label, [grandchildren]]
  const n = kids.length, w = 600 / n; let s = BOX(320 - 110, 18, 220, 50, root, "bxa", {s: 16, b: 1});
  kids.forEach(([k, gk], i) => {
    const x = 20 + w * i + w / 2;
    s += L(320, 68, x, 110) + BOX(x - w / 2 + 8, 110, w - 16, 50, k, "bx", {s: 14, b: 1});
    (gk || []).forEach((g, j) => { const y = 180 + j * (o.gh || 34); s += T(x, y + 10, "• " + g, {s: 13, c: "tx", w: Math.floor(w / 7.5)}); });
  });
  return SV(s, o.h || 360);
}
function timeline(ev, o = {}){
  // ev: [[year(number), label]] placed to scale when o.scale, else evenly
  const x0 = 50, x1 = 590, y = 190; let s = AR(x0 - 20, y, x1 + 30, y, "ax");
  const ys = ev.map(e => e[0]); const lo = o.lo ?? Math.min(...ys), hi = o.hi ?? Math.max(...ys);
  ev.forEach((e, i) => {
    const x = o.scale ? x0 + (e[0] - lo) / (hi - lo) * (x1 - x0) : x0 + i * (x1 - x0) / (ev.length - 1);
    const up = i % 2 === 0; const ty = up ? y - 70 : y + 70;
    s += CI(x, y, 7, "dot") + L(x, y + (up ? -8 : 8), x, ty + (up ? 22 : -22), "ln");
    s += T(x, ty + (up ? 8 : -8), String(e[2] || e[0]), {s: 15, b: 1, c: "acct"}) + T(x, ty + (up ? -18 : 22), e[1], {s: 13, w: 16, mid: true});
  });
  if (o.scale) s += T(320, 345, o.note || "वर्षे प्रमाणात दाखवली आहेत", {c: "mu", s: 13});
  else s += T(320, 345, o.note || "क्रम (प्रमाणात नाही)", {c: "mu", s: 13});

}
function compare(a, b, rows){
  let s = R(30, 20, 285, 44, "bxa") + T(172, 42, a, {b: 1, s: 17}) + R(325, 20, 285, 44, "bxb") + T(467, 42, b, {b: 1, s: 17});
  const rh = Math.min(62, 270 / rows.length);
  rows.forEach(([x, y], i) => { const top = 74 + i * rh; s += R(30, top, 285, rh - 6, "bx", 8) + T(172, top + (rh - 6) / 2, x, {s: 13, w: 34, mid: true}) + R(325, top, 285, rh - 6, "bx", 8) + T(467, top + (rh - 6) / 2, y, {s: 13, w: 34, mid: true}); });

function hbars(data, o = {}){
  const max = o.max || Math.max(...data.map(d => d[1])); const bh = Math.min(46, 240 / data.length); let s = "";
  data.forEach(([lab, v], i) => {

  });
  if (o.title) s += T(320, 28, o.title, {s: 16, b: 1});
  if (o.note) s += T(320, 340, o.note, {c: "mu", s: 13});
  return SV(s);

// coordinate helper for maths graphs
function axes(ox, oy, u, xmax, ymax, o = {}){
  let s = AR(ox - 10, oy, ox + xmax * u + 25, oy, "ax") + AR(ox, oy + 10, ox, oy - ymax * u - 25, "ax");
  for (let i = 1; i <= xmax; i++) s += L(ox + i * u, oy - 4, ox + i * u, oy + 4, "ax") + T(ox + i * u, oy + 16, i, {s: 12, c: "mu"});
  for (let i = 1; i <= ymax; i++) s += L(ox - 4, oy - i * u, ox + 4, oy - i * u, "ax") + T(ox - 14, oy - i * u, i, {s: 12, c: "mu"});
  s += T(ox + xmax * u + 30, oy + 16, "X", {s: 13, c: "mu"}) + T(ox - 14, oy - ymax * u - 28, "Y", {s: 13, c: "mu"}) + T(ox - 10, oy + 16, "O", {s: 12, c: "mu"});
  return s;
}

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = () => $("#app");
const hueVar = s => `--hue:var(--${s.hue})`;
function findCh(id){ for (const s of SUBJECTS){ const i = s.ch.findIndex(c => c.id === id); if (i >= 0) return {s, c:s.ch[i], n:i+1}; } return null; }
function chStatus(c){
  const b = store.quiz[c.id];
  if (b == null) return store.watched[c.id] ? {cls:"", txt:"Watched"} : null;
  if (b >= 80) return {cls:"ok", txt:"Mastered " + b + "%"};
  if (b >= 50) return {cls:"warn", txt:"Revise " + b + "%"};
  return {cls:"bad", txt:"Weak " + b + "%"};
}
function subjProgress(s){
  let pts = 0; s.ch.forEach(c => { if (store.watched[c.id]) pts += 1; if ((store.quiz[c.id] ?? -1) >= 80) pts += 2; else if (store.quiz[c.id] != null) pts += 1; });
  return Math.round(pts / (s.ch.length * 3) * 100);
}
function daysLeft(){
  if (!store.examDate) return null;
  const d = new Date(store.examDate + "T09:00:00"); const now = new Date();
  return Math.ceil((d - now) / 86400000);
}
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function md(text){
  // tiny, safe markdown: escape first, then bold, bullets, paragraphs
  const lines = esc(text).split(/\n/); let out = "", list = null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, '<code style="font-family:var(--mono)">$1</code>');
  for (const ln of lines){
    const m = ln.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m){ if (!list){ list = []; } list.push(inline(m[1])); continue; }
    if (list){ out += "<ul>" + list.map(x => "<li>" + x + "</li>").join("") + "</ul>"; list = null; }
    const h = ln.match(/^#{1,4}\s+(.*)/);
    if (h) out += "<p><b>" + inline(h[1]) + "</b></p>";
    else if (ln.trim()) out += "<p>" + inline(ln) + "</p>";
  }
  if (list) out += "<ul>" + list.map(x => "<li>" + x + "</li>").join("") + "</ul>";
  return out;
}

  if (!AUDIO_CACHE[id]){
    $("#voiceNote").textContent = "मराठी ऑडिओ लोड होत आहे…";
    const r = await fetch(`audio/${id}.mp3`); if (!r.ok) throw new Error("audio " + r.status);
    AUDIO_CACHE[id] = URL.createObjectURL(await r.blob());
  }
  const a = new Audio(AUDIO_CACHE[id]); a.preload = "auto"; a.playbackRate = P.rate;
  if (P && P.chId === id) { P.audio = a; voiceNote(); }
  return a;
}
async function play(){
  if (P.i >= P.scenes.length - 1 && !P.playing && P.scenes[P.i].end) showScene(0);
  P.playing = true; $("#pPlay").textContent = "❚❚ Pause";
  if (P.mode === "file"){
    try { await loadAudio(); } catch(e) { P.mode = "off"; if ($("#pMode")) $("#pMode").value = "off"; $("#voiceNote").textContent = "ऑडिओ लोड झाला नाही; उपशीर्षकांसह धडा सुरू ठेवत आहोत."; }
    if (!P.playing) return;
  }
  runScene();
}
function pause(){
  P.playing = false; clearTimeout(P.timer); cancelAnimationFrame(P.raf);
  try { speechSynthesis.cancel(); } catch(e) {}
  if (P.audio) P.audio.pause();
  if ($("#pPlay")) $("#pPlay").textContent = "▶ Play";
}
function jump(i){
  if (i < 0 || i >= P.scenes.length) return;
  const was = P.playing; pause(); showScene(i); if (was) play();
}
function runScene(){
  const sc = P.scenes[P.i];
  if (P.mode === "file" && P.audio && P.T){
    const a = P.audio, T = P.T;
    a.currentTime = T[P.i]; a.playbackRate = P.rate;
    a.play().catch(() => { pause(); $("#voiceNote").textContent = "ऑडिओ सुरू करण्यासाठी पुन्हा Play दाबा."; });
    const tick = () => {
      if (!P.playing || P.audio !== a) return;
      const t = a.currentTime, i = P.i, s0 = T[i], s1 = T[i + 1];
      const fill = document.querySelectorAll("#segs button")[i].querySelector("i");
      fill.style.width = Math.min(100, Math.max(0, (t - s0) / (s1 - s0) * 100)) + "%";
      if (t >= s1 - 0.05 || a.ended){
        if (i < P.scenes.length - 1){ showScene(i + 1); }
        else { fill.style.width = "100%"; pause(); return; }
      }
      P.raf = requestAnimationFrame(tick);
    };
    tick(); return;
  }
  const dur = sceneDur(sc);
  P.t0 = performance.now(); P.dur = dur * 1000;
  const fill = document.querySelectorAll("#segs button")[P.i].querySelector("i");
  const tick = () => { if (!P.playing) return; const f = Math.min(1, (performance.now() - P.t0) / P.dur); fill.style.width = (f * 100) + "%"; P.raf = requestAnimationFrame(tick); };
  tick();
  const advance = () => {
    if (!P.playing) return;
    if (P.i < P.scenes.length - 1){ showScene(P.i + 1); runScene(); }
    else { fill.style.width = "100%"; pause(); }
  };
  if (P.mode === "device" && "speechSynthesis" in window){
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(sc.say);
      const v = pickVoice(S.lang);
      if (S.lang === "mr" && !v) throw new Error("no marathi voice");
      u.lang = v ? v.lang : "en-IN"; u.rate = P.rate * (S.lang === "mr" ? 0.92 : 1);
      if (v) u.voice = v;
      let doneOnce = false;
      const fin = () => { if (doneOnce) return; doneOnce = true; clearTimeout(P.timer); P.timer = setTimeout(advance, 700); };
      u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
      P.timer = setTimeout(fin, P.dur * 1.8 + 2000);
    } catch(e) { P.timer = setTimeout(advance, P.dur); }
  } else {
    P.timer = setTimeout(advance, P.dur);
  }
}

async function askChat(ctx){
  const box = $("#chatIn"); const q = box.value.trim();
  if (!q || CHAT.busy || !AI) return;
  box.value = "";
  const img = CHAT.file; CHAT.file = null; if ($("#chatFile")) $("#chatFile").textContent = "";
  CHAT.turns.push({role:"user", content: q + (img ? "\n[The student attached a photo of a question.]" : ""), show: q + (img ? " (photo attached)" : "")});

// ---------- study plan ----------
function buildPlan(days){
  const todo = [];
  // interleave subjects so each day mixes them
  const queues = SUBJECTS.map(s => s.ch.filter(c => (store.quiz[c.id] ?? -1) < 80).map(c => ({s, c})));
  let any = true; while (any){ any = false; for (const q of queues){ if (q.length){ todo.push(q.shift()); any = true; } } }
  const dl = daysLeft();
  const studyDays = dl != null && dl > 0 ? Math.max(1, dl - 21) : 30; // keep the last 3 weeks for full revision & papers
  const perDay = Math.max(2, Math.ceil(todo.length / studyDays));
  const out = []; const start = new Date();
  for (let d = 0; d < days; d++){
    const date = new Date(start); date.setDate(start.getDate() + d);
    out.push({date, items: todo.slice(d * perDay, d * perDay + perDay)});
  }
  return out;
}
function renderPlan(){

  app().innerHTML = `

        <div class="eyebrow">Revise these first</div>

      </div>
      <div class="sheet pad small" style="display:grid;gap:6px">
        <div class="eyebrow">Board exam strategy</div>

// ---------- progress charts ----------
function progressCharts(){
  // 1) average best quiz score per subject (single hue, direct labels)
  const rows = SUBJECTS.map(s => { const sc = s.ch.map(c => store.quiz[c.id]).filter(v => v != null); return {s, n: sc.length, avg: sc.length ? Math.round(sc.reduce((a, b) => a + b, 0) / sc.length) : null}; });
  const any = rows.some(r => r.n);
  const bh = 20, gap = 10, lw = 96, cw = 420, top = 26, h = top + rows.length * (bh + gap) + 24, sx = v => lw + v / 100 * (cw - lw - 60);
  let svg = `<svg class="chart" viewBox="0 0 ${cw} ${h}" role="img" aria-label="विषयनिहाय सरासरी गुण">`;
  [0, 50, 80, 100].forEach(v => svg += `<line x1="${sx(v)}" y1="${top - 8}" x2="${sx(v)}" y2="${h - 22}" class="grid${v === 80 ? " goal" : ""}"/><text x="${sx(v)}" y="${h - 6}" class="axt" text-anchor="middle">${v}%</text>`);
  svg += `<text x="${sx(80)}" y="${top - 12}" class="axt goalt" text-anchor="middle">पक्के 80%</text>`;
  rows.forEach((r, i) => { const y = top + i * (bh + gap);
    svg += `<text x="${lw - 10}" y="${y + bh / 2}" class="lab" text-anchor="end" dominant-baseline="middle">${esc(r.s.short)}</text>`;
    if (r.avg != null){ const w = Math.max(4, sx(r.avg) - lw); svg += `<g data-tip="${esc(r.s.name)}: सरासरी ${r.avg}% (${r.n}/${r.s.ch.length} प्रकरणे सोडवली)" tabindex="0"><rect x="${lw}" y="${y - 4}" width="${cw - lw}" height="${bh + 8}" fill="transparent"/><rect x="${lw}" y="${y}" width="${w}" height="${bh}" rx="4" class="cbar"/></g><text x="${lw + w + 8}" y="${y + bh / 2}" class="val" dominant-baseline="middle">${r.avg}%</text>`; }
    else svg += `<text x="${lw + 6}" y="${y + bh / 2}" class="axt" dominant-baseline="middle">अजून सराव प्रश्न सोडवले नाहीत</text>`; });
  svg += `</svg>`;

  // 2) chapter status grid
  const stat = c => { const b = store.quiz[c.id]; if (b != null && b >= 80) return ["ok", "✓", "पक्के"]; if (b != null && b >= 50) return ["warn", "!", "उजळणी"]; if (b != null) return ["bad", "✕", "कच्चे"]; if (store.watched[c.id] || store.read[c.id]) return ["seen", "•", "पाहिले"]; return ["none", "", "सुरू नाही"]; };
  const grid = `<div class="hm">${SUBJECTS.map(s => `<div class="hm-row"><span class="hm-l">${esc(s.short)}</span><div class="hm-cells">${s.ch.map((c, i) => { const [k, sym, lab] = stat(c); const b = store.quiz[c.id]; return `<button class="hm-c ${k}" data-open="${c.id}" data-tip="${esc(s.short)} ${i + 1}. ${esc(c.m)} — ${lab}${b != null ? " " + b + "%" : ""}" aria-label="${esc(c.t)}: ${lab}">${sym || i + 1}</button>`; }).join("")}</div></div>`).join("")}</div>
    <div class="legend">${[["ok","✓","पक्के (80%+)"],["warn","!","उजळणी (50–79%)"],["bad","✕","कच्चे (<50%)"],["seen","•","धडा पाहिला"],["none","1","सुरू नाही"]].map(([k, sym, l]) => `<span><i class="hm-c ${k}">${sym}</i>${l}</span>`).join("")}</div>`;

  // 3) answer-sheet trend
  const ck = store.checks.filter(x => +x.total > 0).map(x => ({...x, pct: Math.round(+x.got / +x.total * 100)}));
  let trend;
  if (ck.length < 2) trend = `<p class="small muted" style="margin:6px 0 0">${ck.length ? `एक उत्तरपत्रिका तपासली: ${ck[0].pct}%. आणखी एक तपासली की इथे प्रगतीचा आलेख दिसेल.` : "उत्तरपत्रिका तपासल्यावर इथे गुणांचा आलेख दिसेल."}</p>`;
  else {
    const W = 420, H = 230, l = 40, r = 16, t = 20, b = 30, X = i => l + i * (W - l - r) / (ck.length - 1), Y = v => t + (100 - v) / 100 * (H - t - b);
    trend = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="उत्तरपत्रिकेतील गुण">` + [0, 50, 100].map(v => `<line x1="${l}" y1="${Y(v)}" x2="${W - r}" y2="${Y(v)}" class="grid"/><text x="${l - 6}" y="${Y(v)}" class="axt" text-anchor="end" dominant-baseline="middle">${v}%</text>`).join("")
      + `<path d="M${l},${Y(0)} ${ck.map((x, i) => `L${X(i)},${Y(x.pct)}`).join(" ")} L${X(ck.length - 1)},${Y(0)} Z" class="carea"/><path d="${ck.map((x, i) => `${i ? "L" : "M"}${X(i)},${Y(x.pct)}`).join(" ")}" class="cline"/>`
      + ck.map((x, i) => `<g data-tip="${esc(x.date)} · ${esc(x.subject)}: ${esc(x.got)}/${esc(x.total)} (${x.pct}%)" tabindex="0"><circle cx="${X(i)}" cy="${Y(x.pct)}" r="14" fill="transparent"/><circle cx="${X(i)}" cy="${Y(x.pct)}" r="${i === ck.length - 1 ? 6 : 4.5}" class="cdot"/></g>`).join("")
      + `<text x="${X(ck.length - 1)}" y="${Y(ck[ck.length - 1].pct) - 14}" class="val" text-anchor="end">${ck[ck.length - 1].pct}%</text>`
      + ck.map((x, i) => (i === 0 || i === ck.length - 1) ? `<text x="${X(i)}" y="${H - 8}" class="axt" text-anchor="${i ? "end" : "start"}">${esc(x.date)}</text>` : "").join("") + `</svg>`;
  }
  return `
  <div class="charts">
    <div class="sheet pad"><div class="eyebrow">विषयनिहाय सरासरी गुण (सराव प्रश्न)</div>${any ? "" : `<p class="small muted" style="margin:4px 0 0">सराव प्रश्न सोडवल्यावर पट्ट्या भरतील.</p>`}${svg}
      <details class="small"><summary>सारणी पहा</summary><table class="tbl"><tr><th>विषय</th><th>सोडवलेली प्रकरणे</th><th>सरासरी</th></tr>${rows.map(r => `<tr><td>${esc(r.s.name)}</td><td>${r.n}/${r.s.ch.length}</td><td>${r.avg != null ? r.avg + "%" : "—"}</td></tr>`).join("")}</table></details></div>
    <div class="sheet pad"><div class="eyebrow">उत्तरपत्रिका गुण (टक्के)</div>${trend}</div>
    <div class="sheet pad hm-card"><div class="eyebrow">प्रकरणनिहाय स्थिती</div>${grid}</div>
  </div>`;
}
// tooltip for charts
const tipEl = document.createElement("div"); tipEl.className = "ctip"; tipEl.hidden = true; document.body.appendChild(tipEl);
function showTip(t, x, y){ tipEl.textContent = t; tipEl.hidden = false; const w = tipEl.offsetWidth; tipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + "px"; tipEl.style.top = Math.max(8, y - tipEl.offsetHeight - 12) + "px"; }
document.addEventListener("pointerover", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("pointermove", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); else tipEl.hidden = true; });
document.addEventListener("focusin", e => { const t = e.target.closest("[data-tip]"); if (t){ const r = t.getBoundingClientRect(); showTip(t.dataset.tip, r.left + r.width / 2, r.top); } });
document.addEventListener("focusout", () => tipEl.hidden = true);

// ---------- global click routing ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-subj],[data-open],[data-ctab]"); if (!t) return;
  if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.subj) go("subject", {subj: t.dataset.subj});
  else if (t.dataset.open) { Q = null; go("chapter", {chap: t.dataset.open, ctab: "video"}); }
  else if (t.dataset.ctab) { stopPlayer(); S.ctab = t.dataset.ctab; renderChapter(); }
});
try { if ("speechSynthesis" in window) speechSynthesis.getVoices(); } catch(e) {}
render();
</script></body></html>
