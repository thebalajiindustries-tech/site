# Render Blueprint for Ganak — https://render.com/docs/blueprint-spec
# This lives on its own 'ganak' branch of thebalajiindustries-tech/site (a
# separate branch from the one your live vidmahitech.com website builds
# from, so this never touches that site).
# In Render: New -> Blueprint -> pick the 'site' repo -> branch 'ganak'.
# Render reads this file and creates both services below in one go.
# Updated: 2026-09-13 - Trigger redeploy to apply env vars
services:
  - type: web
    runtime: docker
    name: ganak-backend
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ping
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: MODEL
        value: claude-haiku-4-5-20251001
      - key: EXTRACT_MODEL
        value: claude-sonnet-5
      - key: CURRENCY
        value: "₹"
      - key: CORS_ORIGINS
        value: https://app.vidmahitech.com
      - key: SEED_DEMO
        value: "1"
      # secrets -- Render will prompt you for these once when you create the
      # Blueprint. Copy each value from backend/.env (open it in Notepad).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: CONTROL_DB_URL
        sync: false
      - key: GANAK_AUTH_SECRET
        generateValue: true
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_ORG_ID
        sync: false
      # --- self-serve connectors: any tenant connects THEIR OWN Gmail/Zoho ---
      - key: PUBLIC_API_BASE_URL
        value: https://api.vidmahitech.com
      - key: PUBLIC_APP_BASE_URL
        value: https://app.vidmahitech.com
      - key: GANAK_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ZOHO_OAUTH_CLIENT_ID
        sync: false
      - key: ZOHO_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

  - type: web
    runtime: docker
    name: ganak-frontend
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    buildArgs:
      # Next.js NEXT_PUBLIC_* vars are baked into the bundle at BUILD time,
      # so they must be passed as a Docker buildArg, not a runtime envVar.
      # (envVar was the bug: the build never received the URL, fell back
      # to localhost:8000, and the server crashed at request time -> 502s.)
      NEXT_PUBLIC_API_URL: https://api.vidmahitech.com
    envVars:
      - key: NODE_ENV
        value: production
