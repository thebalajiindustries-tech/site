services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ganak
      POSTGRES_PASSWORD: ganak
      POSTGRES_DB: the_balaji
    ports: ["5432:5432"]
    volumes:
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # override to talk to the bundled db service
      DATABASE_URL: postgresql://ganak:ganak@db:5432/the_balaji
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [db]

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
